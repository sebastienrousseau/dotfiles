#
# cargo-deny policy for dot-sys: licences, advisories, bans and sources.
# The crate has no runtime dependencies; this governs the dev/bench graph.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Only what the current dev/bench graph carries; extend deliberately.
allow = [
  "Apache-2.0",
  "MIT",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
