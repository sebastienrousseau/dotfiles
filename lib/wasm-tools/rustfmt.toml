#
# Stable-only options so `cargo fmt --check` agrees between developer
# machines (which may carry a nightly-flavoured global config) and CI.
edition = "2021"
max_width = 100
use_field_init_shorthand = true
use_try_shorthand = true
newline_style = "Unix"
