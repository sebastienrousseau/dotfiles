name: Release / Distribute AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.2.503)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute-aur:
    name: Distribute AUR Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout dotfiles
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: resolve-tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No release tag provided"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download release asset
        id: download-asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          VERSION="${{ steps.resolve-tag.outputs.version }}"
          ASSET_NAME="dot-${VERSION}.tar.gz"
          mkdir -p assets

          # release.published fires concurrently with release-package-dot.yml,
          # so the tarball may not be on the release yet. Poll for up to 5 min.
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "${ASSET_NAME}"; then
              echo "Found ${ASSET_NAME} on release (attempt $attempt)"
              break
            fi
            if [[ $attempt -eq 30 ]]; then
              echo "::error::Asset ${ASSET_NAME} never appeared on release ${TAG} after 5 minutes"
              exit 1
            fi
            sleep 10
          done

          echo "Downloading ${ASSET_NAME} from release ${TAG}..."
          gh release download "$TAG" --dir assets --pattern "${ASSET_NAME}"
          ASSET_PATH="$(find assets -name "${ASSET_NAME}" -type f | head -1)"
          if [[ -z "$ASSET_PATH" ]]; then
            echo "::error::Asset ${ASSET_NAME} not found in release ${TAG}"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> $GITHUB_OUTPUT

      - name: Compute SHA256 of tarball
        id: compute-sha256
        run: |
          set -euo pipefail
          ASSET_PATH="${{ steps.download-asset.outputs.asset_path }}"
          SHA256=$(sha256sum "$ASSET_PATH" | awk '{print $1}')
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "SHA256: ${SHA256}"

      - name: Configure AUR SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_KEY}" ]]; then
            echo "::error::Missing AUR_SSH_KEY secret. See docs/security/AUR_PUBLISHING.md for setup."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${AUR_SSH_KEY}" > ~/.ssh/aur_ed25519
          chmod 600 ~/.ssh/aur_ed25519

          # Pin AUR host keys against the fingerprints published at
          # https://aur.archlinux.org/ rather than trusting whatever
          # ssh-keyscan returns on first contact. Scan, compute the
          # fingerprint of each key, and only accept ones on the
          # published allow-list — abort if any unexpected key shows up.
          expected_fps='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI
          SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8'
          scanned=$(mktemp)
          ssh-keyscan aur.archlinux.org > "$scanned" 2>/dev/null
          accepted=0
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            fp=$(printf '%s\n' "$line" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}')
            if grep -qFx "$fp" <<<"$expected_fps"; then
              printf '%s\n' "$line" >> ~/.ssh/known_hosts
              accepted=$((accepted + 1))
            else
              echo "::error::Unexpected AUR host key fingerprint: $fp"
              exit 1
            fi
          done < "$scanned"
          rm -f "$scanned"
          if [[ $accepted -eq 0 ]]; then
            echo "::error::ssh-keyscan returned no AUR host keys"
            exit 1
          fi

          cat >> ~/.ssh/config << 'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Clone or initialise AUR repository
        id: clone-aur
        run: |
          set -euo pipefail
          REPO="ssh://aur@aur.archlinux.org/dot-cli-git.git"
          # AUR has no separate "register name" step: the first successful
          # push to ssh://aur@.../PKGNAME.git creates the package iff the
          # name is free. Three cases to handle:
          #
          #  1. Existing package: `git clone` succeeds, working tree has
          #     prior PKGBUILD/.SRCINFO — straight update.
          #  2. Empty / previously-deleted package: `git clone` succeeds
          #     with `warning: You appear to have cloned an empty
          #     repository.` — no PKGBUILD present. Treat as first publish
          #     but reuse any retained history (AUR keeps git state for
          #     deleted packages, and wiki requires a rebase on top).
          #  3. Brand-new name: `git clone` fails outright — initialise a
          #     local repo and let the subsequent push create the package.
          #
          # A taken-by-someone-else failure still surfaces at push time as
          # "permission denied: <user>".
          if git -c init.defaultBranch=master clone "$REPO" aur-pkg 2>/tmp/aur-clone.err; then
            cat /tmp/aur-clone.err
            if [[ -f aur-pkg/PKGBUILD ]]; then
              echo "Cloned existing AUR package (update flow)."
            else
              echo "Cloned empty/deleted AUR repo (first-publish on existing slot)."
            fi
          else
            echo "Clone failed — brand-new package. Stderr was:"
            cat /tmp/aur-clone.err
            rm -rf aur-pkg
            mkdir aur-pkg
            ( cd aur-pkg
              git init -q -b master
              git remote add origin "$REPO" )
          fi

      - name: Update PKGBUILD and stage LICENSE
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-tag.outputs.version }}"
          SHA256="${{ steps.compute-sha256.outputs.sha256 }}"
          ASSET_PATH="${{ steps.download-asset.outputs.asset_path }}"

          cp install/aur/PKGBUILD aur-pkg/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur-pkg/PKGBUILD
          sed -i "s/^sha256sums=(.*)$/sha256sums=('${SHA256}')/" aur-pkg/PKGBUILD
          # AUR submission guidelines recommend a LICENSE file in the
          # package repo so the licence terms travel with the PKGBUILD.
          cp LICENSE aur-pkg/LICENSE
          echo "Updated PKGBUILD:"
          cat aur-pkg/PKGBUILD

      - name: Generate .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm \
            -v $(pwd)/aur-pkg:/work \
            -w /work \
            archlinux/archlinux:base-devel \
            bash -c "useradd -m builder && chown -R builder:builder /work && su builder -c 'cd /work && makepkg --printsrcinfo > .SRCINFO'"
          # The container chown'd /work to its in-container builder uid (1000),
          # which may not match the runner user. Reclaim ownership so the next
          # step can write .git/config and commit.
          sudo chown -R "$(id -u):$(id -g)" aur-pkg

      - name: Commit and push to AUR
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-tag.outputs.version }}"

          cd aur-pkg
          git config user.name "Sebastien Rousseau"
          git config user.email "sebastian.rousseau@gmail.com"

          # PKGBUILD + .SRCINFO must be in the same commit (the AUR
          # post-receive hook rejects pushes where they're out of sync).
          # LICENSE is committed once and refreshed in case upstream
          # changes it.
          git add PKGBUILD .SRCINFO LICENSE
          git commit -m "dot ${VERSION}"
          git push origin master

      - name: Print AUR URL
        run: |
          echo "AUR package updated: https://aur.archlinux.org/packages/dot-cli-git"
