name: PR Signature Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-signature:
    name: Verify PR description signature
    # The signature is an authorship attestation -- "THE ARCHITECT ᛫
    # Sebastien Rousseau". A bot cannot make it, and nobody should be
    # adding it to a bot's PR on the author's behalf, which is the only
    # way these could ever pass.
    #
    # Without this, every Dependabot PR fails a check it cannot satisfy.
    # Nine were blocked simultaneously, including dependency bumps with
    # security relevance. A required check that a whole class of PR can
    # never pass is not a gate, it is a wall.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot-preview[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block

      - name: Check PR body for required signature
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          SIGNATURE_LINE_1="THE ARCHITECT ᛫ Sebastien Rousseau ᛫ https://sebastienrousseau.com"
          SIGNATURE_LINE_2="THE ENGINE ᛞ EUXIS ᛫ Enterprise Unified Execution Intelligence System ᛫ https://euxis.co"
          NORMALIZED_PR_BODY="$(printf '%s' "$PR_BODY" | tr '\r\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g')"

          if printf '%s' "$NORMALIZED_PR_BODY" | grep -qF "$SIGNATURE_LINE_1" && \
             printf '%s' "$NORMALIZED_PR_BODY" | grep -qF "$SIGNATURE_LINE_2"; then
            echo "✓ PR signature verified"
          else
            echo "::error::PR description must end with the required Euxis signature."
            echo ""
            echo "Required signature (append to PR body):"
            echo "---"
            echo "$SIGNATURE_LINE_1"
            echo "$SIGNATURE_LINE_2"
            exit 1
          fi
