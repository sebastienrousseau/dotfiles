name: PR Signature Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-signature:
    name: Verify PR description signature
    # The signature is a human attestation of authorship. A bot cannot
    # make it, so requiring it of bot-authored PRs makes them
    # permanently unmergeable rather than unsigned — Dependabot updates
    # are otherwise stuck on exactly this. Skipping is the honest
    # outcome: an absent signature on a Dependabot PR is accurate.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot-preview[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block

      - name: Check PR body for required signature
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          SIGNATURE_LINE_1="THE ARCHITECT ᛫ Sebastien Rousseau ᛫ https://sebastienrousseau.com"
          SIGNATURE_LINE_2="THE ENGINE ᛞ EUXIS ᛫ Enterprise Unified Execution Intelligence System ᛫ https://github.com/sebastienrousseau/euxis"
          NORMALIZED_PR_BODY="$(printf '%s' "$PR_BODY" | tr '\r\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g')"

          if printf '%s' "$NORMALIZED_PR_BODY" | grep -qF "$SIGNATURE_LINE_1" && \
             printf '%s' "$NORMALIZED_PR_BODY" | grep -qF "$SIGNATURE_LINE_2"; then
            echo "✓ PR signature verified"
          else
            echo "::error::PR description must end with the required Euxis signature."
            echo ""
            echo "Required signature (append to PR body):"
            echo "---"
            echo "$SIGNATURE_LINE_1"
            echo "$SIGNATURE_LINE_2"
            exit 1
          fi
