name: Doc Drift / Generators

# Block PRs that let a generator-managed file drift out of sync with
# its source. Two generators today, both shipped in v0.2.503:
#
#   - tools/docs/generate-command-index.sh --check
#   - tools/docs/generate-command-reference.sh --check
#       Verifies docs/manual/command-index.md matches the plugin manifests.
#
#   - scripts/verify-release-versions
#       Verifies every human-visible version surface (install
#       snippets, badges, man page, agent/MCP cards, llms.txt,
#       CHANGELOG heading) matches defaults/.chezmoidata.toml.
#
#   - tools/docs/generate-manpage.sh --check
#       Verifies the share/man/man1 pages match the plugin manifests.
#
#   - tools/docs/generate-completions.sh --check
#       Verifies the five committed completions match the manifests.
#
# Adding a third generator is just adding a new step below — keep
# this workflow flat and easy to extend.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/manual/command-index.md'
      - 'bin/dot'
      - 'scripts/dot/commands/**'
      - 'tools/docs/generate-command-index.sh'
      - 'tools/docs/generate-command-reference.sh'
      - 'lib/dot/data/**'
      - 'examples/command-reference.txt'
      - 'scripts/verify-release-versions'
      - 'scripts/release-preflight'
      - 'tests/unit/qa/test_release_preflight.sh'
      - '.github/workflows/doc-drift.yml'
      - 'tools/docs/generate-manpage.sh'
      - 'tools/docs/man/dot.1.in'
      - 'tools/docs/gen_manpages.py'
      - 'schemas/cli/flags.json'
      - 'tools/docs/generate-completions.sh'
      - 'tools/docs/gen_completions.py'
      - 'tools/docs/gen_cmdlets.py'
      - 'schemas/cli/verbs.json'
      - 'share/powershell/**'
      - 'lib/dot/data/commands.txt'
      - 'plugins/**'
      - 'share/completions/**'
      - 'defaults/dot_local/share/bash-completion/completions/dot'
      - 'defaults/dot_config/fish/completions/dot.fish'
      - 'defaults/dot_config/nushell/completions.nu'
      - 'llms.txt'
      - 'CHANGELOG.md'
      - '.well-known/**'
      - 'install.sh'
      - 'scripts/qa/scorecard-snapshot.sh'
      - 'defaults/.chezmoidata.toml'
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'package.json'
      - 'share/man/man1/**'
      - 'lib/dot/bento.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-index:
    name: Generators / command-index
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Isolated jobs: checkout + a local script only, no external
          # fetches. Endpoints are the GitHub set the runner needs to pull
          # actions and the repo. If a future step here needs more egress,
          # add it or revert this job to `audit`.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify docs/manual/command-index.md is in sync
        run: bash tools/docs/generate-command-index.sh --check
      - name: Verify examples/command-reference.txt is in sync
        run: bash tools/docs/generate-command-reference.sh --check

  version-consistency:
    name: Generators / version-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Isolated jobs: checkout + a local script only, no external
          # fetches. Endpoints are the GitHub set the runner needs to pull
          # actions and the repo. If a future step here needs more egress,
          # add it or revert this job to `audit`.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify version-bearing files match defaults/.chezmoidata.toml
        run: |
          bash scripts/verify-release-versions
          # Branch validation permits development after an immutable release.
          # Actual release creation retains strict --require-untagged preflight.
          bash scripts/release-preflight --development

  manpage:
    name: Generators / man page
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Isolated jobs: checkout + a local script only, no external
          # fetches. Endpoints are the GitHub set the runner needs to pull
          # actions and the repo. If a future step here needs more egress,
          # add it or revert this job to `audit`.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the share/man/man1 pages match the plugin manifests
        run: bash tools/docs/generate-manpage.sh --check

  completions:
    name: Generators / completions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Isolated jobs: checkout + a local script only, no external
          # fetches. Endpoints are the GitHub set the runner needs to pull
          # actions and the repo. If a future step here needs more egress,
          # add it or revert this job to `audit`.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify committed shell completions match the command registry
        run: bash tools/docs/generate-completions.sh --check
      - name: Verify the PowerShell cmdlets match the plugin manifests
        run: python3 tools/docs/gen_cmdlets.py --check
