name: Pages

# Builds and deploys the docs/ site to GitHub Pages (custom domain:
# doc.dotfiles.io) with ssg and the vendored Lucid theme
# (tools/docs/build-site.sh: the docs pages, the landing page and the manual
# under /manual/, with every internal link checked). The repo's Pages settings have
# build_type=workflow, so this is the canonical deploy path — no
# Jekyll-on-source-branch fallback.
#
# Conflict note: manual-publish.yml builds the multi-format Manual
# (HTML/PDF/EPUB/...) and attaches it to releases. It used to also
# deploy `_build/manual/` to Pages, which races with this workflow.
# That deploy step has been removed in the same change that introduced
# this file; manual binaries are now downloadable only from releases.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/docs/build-site.sh'
      - 'tools/docs/build-manual-site.*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress
# runs — Pages publishes are idempotent and we want each push handled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (ssg + Lucid)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install ssg (pinned release, SHA-256 verified)
        env:
          SSG_VERSION: 0.0.63
          SSG_SHA256: b8402ae9bb7a4443e30a4926f067b40feb89477f70a4c9a9d062622bab86ae36
        run: |
          set -euo pipefail
          asset="ssg-v${SSG_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/sebastienrousseau/static-site-generator/releases/download/v${SSG_VERSION}/${asset}"
          echo "${SSG_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ssg"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/ssg" ssg
          echo "$RUNNER_TEMP/ssg" >>"$GITHUB_PATH"

      - name: Build the site with ssg (Lucid theme) into ./site
        # python3 (standard library only) is preinstalled on the runner.
        run: bash tools/docs/build-site.sh --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
