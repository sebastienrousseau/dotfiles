name: Pages

# Builds and deploys the docs/ site to GitHub Pages (custom domain:
# doc.dotfiles.io) with ssg and the vendored Lucid theme
# (tools/docs/build-site.sh: the docs pages, the landing page and the manual
# under /manual/, with every internal link checked, and the sitemap and
# hreflang alternates checked against the built pages). Pull requests that
# touch the site build it only; pushes to main also deploy. The repo's Pages settings have
# build_type=workflow, so this is the canonical deploy path — no
# Jekyll-on-source-branch fallback.
#
# Conflict note: manual-publish.yml builds the multi-format Manual
# (HTML/PDF/EPUB/...) and attaches it to releases. It used to also
# deploy `_build/manual/` to Pages, which races with this workflow.
# That deploy step has been removed in the same change that introduced
# this file; manual binaries are now downloadable only from releases.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/docs/build-site.sh'
      - 'tools/docs/build-manual-site.*'
      - 'tools/docs/finalize-site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/docs/build-site.sh'
      - 'tools/docs/build-manual-site.*'
      - 'tools/docs/finalize-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress
# runs — Pages publishes are idempotent and we want each push handled.
# Pull-request builds get their own group so they never queue a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site (ssg + Lucid)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install ssg (pinned release, SHA-256 verified)
        env:
          SSG_VERSION: 0.0.72
          SSG_SHA256: 948b9372c1e35735af1c8a5c5bb95ada6867df919c3302bbceaaa67e51453c6c
        run: |
          set -euo pipefail
          asset="ssg-v${SSG_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/sebastienrousseau/static-site-generator/releases/download/v${SSG_VERSION}/${asset}"
          echo "${SSG_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ssg"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/ssg" ssg
          echo "$RUNNER_TEMP/ssg" >>"$GITHUB_PATH"

      - name: Build the site with ssg (Lucid theme) into ./site
        # python3 (standard library only) is preinstalled on the runner.
        run: bash tools/docs/build-site.sh --out site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
