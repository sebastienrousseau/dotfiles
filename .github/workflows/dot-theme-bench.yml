name: dot theme Bench

# Runs the dot theme micro-benchmarks on every push touching theme
# code (or the bench itself). Each hot-path assertion has a threshold
# baked into tests/performance/bench_dot_theme.sh; overshoots turn the
# job red.
#
# This is a hard perf ratchet: if someone lands a change that regresses
# 'dot theme set' idempotent from ~40ms to ~200ms, CI catches it.
#
# The benchmark tolerates absent `hyperfine` and absent `dot` by
# exiting 0 with a SKIP marker, so this workflow is safe to enable on
# runners that don't have the full dotfiles installed yet.

on:
  push:
    branches:
      - 'main'
      - 'feat/**'
    paths:
      - 'bin/dot-theme-sync'
      - 'scripts/theme/**'
      - 'tests/performance/bench_dot_theme.sh'
      - '.github/workflows/dot-theme-bench.yml'
  pull_request:
    paths:
      - 'bin/dot-theme-sync'
      - 'scripts/theme/**'
      - 'tests/performance/bench_dot_theme.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: dot theme benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install hyperfine + jq + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine jq shellcheck

      - name: Symlink dotfiles source at ~/.dotfiles so `dot` resolves
        run: |
          ln -sf "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Put the dot dispatcher on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$GITHUB_WORKSPACE/bin/dot" "$HOME/.local/bin/dot"
          ln -sf "$GITHUB_WORKSPACE/bin/dot-theme-sync" "$HOME/.local/bin/dot-theme-sync"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bench
        run: |
          # `set +e` — the bench self-reports pass/fail via exit code.
          # We want the pretty per-line output first, then decide on
          # the run outcome.
          bash tests/performance/bench_dot_theme.sh
        # Fails the job on any bench that overshoots its threshold.

      - name: Symbol coverage (100 % ratchet)
        run: |
          # Fails the run if any function in bin/dot-theme-sync or
          # any subcommand in scripts/theme/switch.sh isn't
          # referenced by at least one test file. Doubles as a
          # "delete-a-test" alarm — removing the only mention of a
          # helper trips the gate at PR time.
          MIN_COVERAGE=100 bash tests/performance/coverage_dot_theme.sh

      - name: Shellcheck info-severity sweep on theme dir
        run: |
          # Warnings are already zero (enforced by ci-enforced.yml).
          # Excluded codes are intentional patterns in this codebase:
          #   SC1090/SC1091 — dynamic source paths under $REPO_ROOT
          #   SC2034 — unused local vars that document dispatch inputs
          #   SC2015 — `A && B || C` is intentional in _ok/_fail helpers
          #   SC2016 — single-quoted expressions are awk program bodies
          #   SC2030/SC2031 — subshell modifications are our parallel
          #                   orchestrator's whole point
          #   SC2295 — quoting inside ${..:-defaults} is style-only
          shellcheck --severity=info \
            -e SC1090 -e SC1091 -e SC2034 \
            -e SC2015 -e SC2016 -e SC2030 -e SC2031 -e SC2295 \
            bin/dot-theme-sync \
            scripts/theme/*.sh \
            tests/unit/theme/*.sh \
            tests/regression/test_dot_theme_regressions.sh \
            tests/integration/test_dot_theme_e2e.sh \
            tests/performance/bench_dot_theme.sh \
            tests/performance/coverage_dot_theme.sh
