name: CI (Standards Enforced)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  # Manual trigger for full CI
  workflow_dispatch:

# Least-privilege top-level — Scorecard's Token-Permissions check
# flags any non-`read` token at workflow level. The only job that
# needs write is `security-infrastructure` (upload-sarif). The
# `pull-requests:write` was leftover from an earlier reusable
# workflow and no job in this pipeline uses it.
permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHEZMOI_VERSION: "2.72.2"
  # Enforce warnings as errors globally
  WARNINGS_AS_ERRORS: "1"

jobs:
  # ============================================================================
  # STAGE 1: LINT (Zero-warning policy enforced, reuses shared workflow)
  # ============================================================================
  lint-shell:
    name: Lint / Shell (Zero Warnings)
    uses: ./.github/workflows/reusable-shell-lint.yml
    with:
      include_tests: false
      shellcheck_severity: error
      shellcheck_excludes: SC1091,SC2030,SC2031
      fail_on_shellcheck: true
      run_shfmt: true
      shfmt_targets: scripts/**/*.sh install.sh defaults/.chezmoitemplates/**/*.sh

  lint-lua:
    name: Lint / Lua (Zero Warnings)
    uses: ./.github/workflows/reusable-lua-lint.yml
    with:
      target: defaults/dot_config/nvim
      strict: true
      stylua_version: "0.20.0"

  lint-nix:
    name: Lint / Nix (Zero Warnings)
    # reusable-nix-lint.yml requests id-token: write for the Nix installer's
    # OIDC-backed cache. Top-level workflow permissions don't cover that, so
    # the caller job must grant it explicitly.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-nix-lint.yml
    with:
      flake_dir: nix
      run_fmt_check: true
      run_flake_check: true
      run_build: false

  lint-copyright:
    name: Lint / Copyright Headers (Zero Tolerance)
    uses: ./.github/workflows/reusable-copyright-lint.yml

  # ============================================================================
  # STAGE 2: SECURITY (Mandatory - No bypass allowed)
  # ============================================================================
  security-secrets:
    name: Security / Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks (No bypass)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-dependency-audit:
    name: Security / Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tools/ci/check-registry.sh verifies docs/registry.json.minisig once
      # security/registry.pub is committed; until then it skips, and so does
      # this install.
      - name: Install minisign for the registry signature check
        if: hashFiles('security/registry.pub') != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      # The scanner needs ripgrep. Without it the old inline rg checks here
      # failed with "command not found", which `if` read as "no match".
      - name: Install ripgrep
        run: bash tools/ci/install-tools.sh ripgrep:rg
      - name: Audit shell dependencies
        run: |
          echo "::notice::Auditing external dependencies in shell scripts"
          # Download-to-shell in any shell, YAML or Dockerfile (curl and wget,
          # piped, command or process substitution), comments and tests excluded.
          bash tools/ci/check-remote-installers.sh
          bash tools/ci/check-registry.sh
      # `${{ }}` expanded inside run: scripts (tags, refs, inputs, step
      # outputs, secrets) and read-only checkouts that keep the token in
      # git config. Legacy findings are held by
      # tools/ci/workflow-injection-baseline.txt.
      - name: Workflow injection and checkout credentials
        run: python3 tools/ci/check-workflow-hardening.py
      - name: Check for hardcoded secrets patterns
        run: |
          echo "::notice::Scanning for hardcoded secrets patterns"
          # More aggressive secret detection
          if rg -i "password|token|key|secret" --type sh --type lua | grep -E "=.*['\"][^'\"]{8,}['\"]"; then
            echo "::error::Potential hardcoded secret detected"
            exit 1
          fi

  security-infrastructure:
    name: Security / Infrastructure Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # upload-sarif (Checkov)
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkov Infrastructure Security
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # v12.3128.0
        with:
          framework: dockerfile,yaml,secrets
          quiet: false
          soft_fail: false  # FAIL on security issues
          output_format: sarif
          output_file_path: reports/checkov.sarif
          # fuzz/oss-fuzz/ is OSS-Fuzz scaffolding — it MUST use
          # the upstream base image as-is (no USER, HEALTHCHECK, or
          # tagged FROM); OSS-Fuzz runs the harnesses, not us.
          skip_path: fuzz/oss-fuzz/
      - name: Upload Checkov results to GitHub Security
        if: always() && hashFiles('reports/checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: reports/checkov.sarif

  # ============================================================================
  # STAGE 3: TEST MATRIX (Linux + macOS enforced)
  # ============================================================================
  test-matrix:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # Enforced 10-minute timeout
    strategy:
      fail-fast: false
      matrix:
        # ubuntu + macos (Intel) + macos-14 (Apple Silicon). All three
        # platforms enforced — drift on M-series no longer ships silent.
        os: [ubuntu-latest, macos-latest, macos-14]
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Chezmoi
        uses: ./.github/actions/setup-chezmoi
      - name: Chezmoi Apply Test
        run: |
          chezmoi init
          chezmoi apply --verbose --dry-run
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-test-${{ runner.os }}
          path: ~/.local/share/chezmoi/.log
          retention-days: 5

  test-unit:
    name: Test / Unit Tests
    uses: ./.github/workflows/reusable-test-suite.yml
    with:
      min_coverage: "100"
      run_integration: true
      run_strict_checks: true
      # Mirrors ci.yml: the 10,526-test full suite exceeded the former 15m
      # budget while integration was still making progress.
      timeout_minutes: 25

  # ----------------------------------------------------------------------------
  # Ratchets and the mutation gate live here so Merge Gate (a required check)
  # aggregates them; in ci.yml they fed only the unrequired Quality Gate and
  # could not block a merge.
  # ----------------------------------------------------------------------------
  # Tests that inspect source text instead of running it cannot catch
  # wrong behaviour; tools/ci/check-source-grep-tests.py holds the count
  # per file at or below tools/ci/source-grep-baseline.txt.
  lint-tests:
    name: Lint / Tests run the code
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source-grep ratchet
        run: python3 tools/ci/check-source-grep-tests.py

  # chezmoi run_* scripts install with the user's privileges on every apply,
  # so each install must be pinned: no @latest, cargo install --locked, no
  # git clone of a moving branch. Versions live in .chezmoidata.toml.
  lint-install-pins:
    name: Lint / Install pins
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unpinned installs in run_* scripts
        run: bash tools/ci/check-unpinned-installs.sh

  # Per-function cyclomatic, cognitive, Halstead and NLOC measures for the
  # shell code; tools/ci/complexity.py fails when a unit crosses a limit
  # without being in tools/ci/complexity-baseline.txt, or a baselined unit
  # gets worse. shfmt supplies the AST, pinned by version and checksum.
  lint-complexity:
    name: Lint / Complexity ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHFMT_VERSION: v3.13.1
      SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned shfmt
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $RUNNER_TEMP/shfmt" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
          shfmt --version
      - name: Complexity ratchet
        run: python3 tools/ci/complexity.py

  # Mutation gate on the lines a PR changes (tools/ci/mutation-test.py).
  # Line coverage says a line ran; this says whether the tests would notice
  # it being wrong. One plausible bug per changed line, judged only by
  # behavioural tests (source-grep tests are listed in
  # tools/ci/mutation-structural.txt and do not count). Survivors are
  # annotated on the PR diff. The sample cap bounds the runtime of a large
  # PR; the score is over the sample.
  test-mutation:
    name: Test / Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tests that prove the chezmoi-facing code skip without chezmoi,
      # which left every mutant in such code alive here while the same run
      # killed them locally (#1238).
      - name: Setup chezmoi
        uses: ./.github/actions/setup-chezmoi

      - name: Mutation score on changed lines (>= 80%)
        run: |
          set -euo pipefail
          chmod +x tests/framework/*.sh
          # No --depth: in this full clone a shallow fetch of a base branch
          # that moved since checkout grafts its tip parentless, and
          # origin/<base>...HEAD then has no merge base (git exits 128).
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 tools/ci/mutation-test.py \
            --base "origin/${{ github.base_ref }}" \
            --min-score 80 \
            --max-mutants 60 \
            --jobs 4 \
            --timeout 240 \
            --github \
            --json mutation-report.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: mutation-report.json
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------------------------------------
  # scripts/security/enforce-policies.sh. This job lives here, not in
  # security-enhanced.yml, because Merge Gate is the only required check that
  # aggregates jobs, and it aggregates only this workflow. A copy in
  # security-enhanced.yml ran but could not block a merge: branch protection
  # requires Merge Gate, Reliability Summary, Pre-Commit, Check sign-off and
  # Verify PR description signature — not Security Summary. A gate that runs
  # and cannot fail the merge is the defect this script was fixed for.
  # ----------------------------------------------------------------------------
  security-policy-script:
    name: Security / Policy Script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the script runs gitleaks in git mode, and
          # .gitleaksignore entries are fingerprinted
          # `<commit>:<file>:<rule>:<line>`. On a shallow checkout those commits
          # are absent, so every allowlisted false positive would come back.
          fetch-depth: 0

      - name: Install shellcheck
        run: bash tools/ci/install-tools.sh shellcheck

      - name: Install gitleaks and opa
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          OPA_VERSION: 1.20.2
          OPA_SHA256: 69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Pinned by version AND checksum. install-tools.sh is apt-based and
          # neither tool is an apt package, so these come from their releases.
          curl -fsSL --retry 3 --max-time 120 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks

          curl -fsSL --retry 3 --max-time 120 -o "$HOME/.local/bin/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $HOME/.local/bin/opa" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opa"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Enforce security policies
        run: |
          set -euo pipefail
          # STRICT: a missing tool becomes an error rather than a skip. The
          # script tolerates absent tools so a contributor without opa still
          # gets the other checks; CI provisions all three, so here a skip
          # means provisioning broke and must fail loudly.
          DOTFILES_POLICY_STRICT=1 ./scripts/security/enforce-policies.sh

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: security-policy-report
          path: |
            security-report.md
            .security-audit.log
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # STAGE 4: MERGE GATE (All checks must pass)
  # ============================================================================
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [
      lint-shell,
      lint-lua,
      lint-nix,
      lint-copyright,
      security-secrets,
      security-dependency-audit,
      security-infrastructure,
      security-policy-script,
      test-matrix,
      test-unit,
      lint-tests,
      lint-install-pins,
      lint-complexity,
      test-mutation,
    ]
    # Run even when a dependency fails. Without this the gate is *skipped*
    # when test-unit fails, and GitHub counts a skipped required check as
    # passed, so a red test job could merge (it did, in #1154). A needed job
    # that was legitimately skipped still passes.
    if: always()
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: All checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$RESULTS")"
          if [[ -n "$failed" ]]; then
            echo "::error::Merge blocked; these required jobs did not pass:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "::notice::All CI checks passed - merge approved"
          echo "✅ All quality gates satisfied"

# ============================================================================
# NIGHTLY JOBS (Advanced checks)
# ============================================================================
  nightly:
    name: Nightly / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        check: [dependency-updates, beta-testing, extended-tests]
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Update Check
        if: matrix.check == 'dependency-updates'
        run: |
          echo "::notice::Checking for available dependency updates"
          ./tools/maintenance/check-updates.sh || true
      - name: Beta/Nightly Testing
        if: matrix.check == 'beta-testing'
        run: |
          echo "::notice::Testing with beta/nightly versions"
          export USE_BETA_VERSIONS=1
          ./tests/framework/test_runner.sh || true
      - name: Extended Test Suite
        if: matrix.check == 'extended-tests'
        run: |
          echo "::notice::Running extended test suite"
          export RUN_EXTENDED=1
          ./tests/framework/test_runner.sh || true
