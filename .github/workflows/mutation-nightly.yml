name: Mutation (core, nightly)

# The PR gate (ci-enforced.yml, Test / Mutation) scores only the lines a PR
# changes. This scores the core scripts themselves, every night, so the
# suite's ability to catch a regression in them is measured, not assumed.
# The floor is the plan's bar, 90%. Survivors are annotated on the run; a
# line that cannot be killed is opted out in place with
# `# mutation: ignore <reason>`.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_mutants:
        description: Deterministic sample size (0 = every eligible line)
        default: '120'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mutation-core:
    name: Mutation / core scripts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mutation score on the core scripts (floor 90%)
        env:
          MAX_MUTANTS: ${{ inputs.max_mutants || '120' }}
        run: |
          set -euo pipefail
          chmod +x tests/framework/*.sh
          mapfile -t core < <(grep -vE '^\s*(#|$)' tools/ci/mutation-core.txt)
          python3 tools/ci/mutation-test.py \
            --full \
            --min-score 90 \
            --max-mutants "$MAX_MUTANTS" \
            --jobs 4 \
            --timeout 240 \
            --github \
            --json mutation-core.json \
            "${core[@]}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-core-report
          path: mutation-core.json
          if-no-files-found: ignore
          retention-days: 30
