name: Mutation (core, nightly)

# The PR gate (ci-enforced.yml, Test / Mutation) scores only the lines a PR
# changes. This scores the core scripts themselves, every night, so the
# suite's ability to catch a regression in them is measured, not assumed.
# The plan's bar is 90%; the floor starts at the measured baseline and is
# raised as survivors are killed. Survivors are annotated on the run.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_mutants:
        description: Deterministic sample size (0 = every eligible line)
        default: '120'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mutation-core:
    name: Mutation / core scripts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mutation score on the core scripts (floor 80%)
        env:
          MAX_MUTANTS: ${{ inputs.max_mutants || '120' }}
        run: |
          set -euo pipefail
          chmod +x tests/framework/*.sh
          mapfile -t core < <(grep -vE '^\s*(#|$)' tools/ci/mutation-core.txt)
          python3 tools/ci/mutation-test.py \
            --full \
            --min-score 80 \
            --max-mutants "$MAX_MUTANTS" \
            --jobs 4 \
            --timeout 240 \
            --github \
            --json mutation-core.json \
            "${core[@]}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-core-report
          path: mutation-core.json
          if-no-files-found: ignore
          retention-days: 30
