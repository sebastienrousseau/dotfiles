name: Core and delivery contracts

on:
  pull_request:
    paths:
      - 'core/**'
      - 'schemas/dpp-hello-v1.schema.json'
      - 'install/lib/installers.sh'
      - 'tests/unit/core/**'
      - 'tests/unit/install/test_archive_adversarial.py'
      - 'tests/visual/**'
      - 'tests/integration/test_npx_clean_container.sh'
      - '.github/workflows/core-contracts.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Race, protocol and transaction tests
        working-directory: core
        run: go test -race ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Repeat crash boundaries (140 trials per Unix host)
        if: runner.os != 'Windows'
        working-directory: core
        run: go test ./transaction -run TestCrashBoundaries -count=20
      - name: Bounded protocol fuzzing
        if: runner.os == 'Linux'
        working-directory: core
        run: go test ./protocol -fuzz FuzzFrames -fuzztime 15s -parallel 2
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python tests/unit/core/test_contract_schemas.py
      - run: python tests/unit/install/test_archive_adversarial.py
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real Kitty and tmux captures
        run: |
          mkdir -p "$RUNNER_TEMP/visual-output"
          bash tests/visual/fetch-fonts.sh "$RUNNER_TEMP/visual-fonts"
          docker build -f tests/visual/Dockerfile -t dot-visual-contracts:ci .
          docker run --rm --init --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/visual-fonts,dst=/usr/local/share/fonts/dot,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/visual-output,dst=/output" \
            dot-visual-contracts:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kitty-tmux-visual-evidence
          path: ${{ runner.temp }}/visual-output
          if-no-files-found: error
  npm-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/integration/test_npx_clean_container.sh 0.2.522
