name: Core and delivery contracts

on:
  pull_request:
    paths:
      - 'core/**'
      - 'schemas/dpp-hello-v1.schema.json'
      - 'schemas/cli/**'
      - 'tests/unit/dot-cli/test_naming_registry.py'
      # CLI-contract lint (ADR-020): manifests, routes, the command table
      # and its generator, the binary it runs, and the version that expires
      # deprecated names.
      - 'plugins/**'
      - 'tools/ci/check-cli-contract.py'
      - 'tools/ci/cli_command_table.py'
      - 'lib/dot/data/commands.txt'
      - 'tests/unit/dot-cli/test_dot_command_table.sh'
      - 'tools/ci/cli-contract-baseline.txt'
      - 'tests/unit/dot-cli/test_cli_contract_lint.py'
      - 'lib/dot/data/routes.txt'
      - 'bin/dot'
      - 'defaults/.chezmoidata.toml'
      - 'install/lib/installers.sh'
      - 'tests/unit/core/**'
      - 'tests/unit/install/test_archive_adversarial.py'
      - 'tests/visual/**'
      # The visual job renders the tmux config through its helper and the
      # theme goldens; #1211 changed all three and this never ran.
      - 'defaults/dot_config/tmux/**'
      - 'defaults/dot_local/bin/executable_tmux-status'
      - 'tests/fixtures/theme-render/**'
      - 'tests/consumer/**'
      - 'tests/unit/ci/test_npx_consumer_lane.sh'
      - '.github/workflows/core-contracts.yml'
      - 'requirements-contracts.txt'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm exercises the arm64 seccomp profile (no x32 guard);
        # ubuntu-latest (amd64) runs TestX32SyscallsAreKilled.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Race, protocol and transaction tests
        working-directory: core
        run: go test -race ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Repeated plugin cleanup (30 descendants + 1000 exits per Unix host)
        if: runner.os != 'Windows'
        working-directory: core
        run: |
          go test ./host -run '^TestChildGroupCleanup$' -count=10
          go test ./host -run '^TestProcessExitCleanup$' -count=10
      - name: Repeat crash boundaries (140 trials per Unix host)
        if: runner.os != 'Windows'
        working-directory: core
        run: go test ./transaction -run TestCrashBoundaries -count=20
      - name: Bounded protocol fuzzing
        if: runner.os == 'Linux'
        working-directory: core
        run: go test ./protocol -fuzz FuzzFrames -fuzztime 900000x -parallel 2
      - name: Repeat archive recovery boundaries (200 trials per Unix host)
        if: runner.os != 'Windows'
        working-directory: core
        run: go test ./transaction -run '^TestArchiveCrashBoundaries$' -count=10
      - name: Repeat abandoned pre-prepare cleanup boundaries
        if: runner.os != 'Windows'
        working-directory: core
        run: go test ./transaction -run '^TestDiscardAbandoned' -count=10
      - name: Repeat post-commit effect recovery (60 trials per Unix host)
        if: runner.os != 'Windows'
        working-directory: core
        run: go test ./transaction -run '^TestEffect' -count=20
      - name: Repeat Linux process-containment boundary (10 trials)
        if: runner.os == 'Linux'
        working-directory: core
        run: go test ./sandbox ./cmd/dot-core -run '^(TestLinuxContainment|TestContainedCommandLifecycle)$' -count=5
      - name: Repeat Linux executable replacement boundary
        if: runner.os == 'Linux'
        working-directory: core
        run: go test ./host -run '^TestPinned' -count=100
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-contracts.txt
      - run: python tests/unit/core/test_contract_schemas.py
      - run: python tests/unit/dot-cli/test_naming_registry.py
      - run: python tools/ci/check-cli-contract.py
      - run: python tests/unit/dot-cli/test_cli_contract_lint.py
      - run: bash tests/unit/dot-cli/test_dot_command_table.sh
      - run: python tests/unit/install/test_archive_adversarial.py
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Real Kitty and tmux captures
        run: |
          mkdir -p "$RUNNER_TEMP/visual-output"
          bash tests/visual/fetch-fonts.sh "$RUNNER_TEMP/visual-fonts"
          docker build -f tests/visual/Dockerfile -t dot-visual-contracts:ci .
          docker run --rm --init --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/visual-fonts,dst=/usr/local/share/fonts/dot,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/visual-output,dst=/output" \
            dot-visual-contracts:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kitty-tmux-visual-evidence
          path: ${{ runner.temp }}/visual-output
          if-no-files-found: error
  npm-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/consumer/test_npx_clean_container.sh 0.2.522
