name: Mirror main → master

# During the default-branch rename from `master` → `main`, this workflow
# keeps `master` as a passive mirror of `main` so previously-published
# `raw.githubusercontent.com/…/master/…` install URLs keep resolving.
#
# The rename PR flips defaults, but historical install commands people
# have bookmarked (`bash -c "$(curl -fsSL .../master/install.sh)"`) don't
# auto-redirect on the raw-content host — only `github.com/*` URLs do.
# This mirror is the permanent compatibility redirect for raw-content URLs.
# `main` remains the only development/default branch; never commit directly to
# `master` or add it as a pull-request target.
#
# NOTE: this workflow needs write access to push a branch. It uses the
# default GITHUB_TOKEN, which has `contents: write` when granted below.

on:
  # Only fire on main pushes — if this also fired on master pushes, the
  # mirror itself would trigger it, wasting minutes on a no-op re-push.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # least-privilege default; the mirror job escalates below

concurrency:
  group: mirror-main-to-master
  cancel-in-progress: false

jobs:
  mirror:
    name: Fast-forward master to main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # push main → master mirror
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout (full history — we push a specific SHA to master)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror main → master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # If master doesn't exist yet, GitHub returns 404 — create it.
          if ! git ls-remote --exit-code --heads origin master >/dev/null 2>&1; then
            echo "Creating master from main..."
            git push origin "$GITHUB_SHA:refs/heads/master"
            exit 0
          fi
          # Otherwise fast-forward. If it can't fast-forward (someone
          # pushed directly to master), fail loudly rather than clobber.
          echo "Fast-forwarding master to $GITHUB_SHA..."
          git push origin "$GITHUB_SHA:refs/heads/master"

      - name: Verify compatibility mirror
        run: |
          set -euo pipefail
          mirrored_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [[ "$mirrored_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::master mirror is $mirrored_sha; expected $GITHUB_SHA"
            exit 1
          fi
          echo "master compatibility mirror matches main at $GITHUB_SHA"
