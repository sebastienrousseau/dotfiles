name: Release / Package dot CLI

# On every release, package a standalone tarball + zip of the dot CLI
# (bin/, lib/, scripts/, security/, docs/, defaults/, share/) and attach it
# to the release as a self-contained distribution-
# ready artefact. Downstream distribution workflows
# (release-distribute.yml) hash the tarball and push to Homebrew /
# Scoop / AUR taps.
#
# The tarball is the deterministic, distribution-friendly bundle of:
#   bin/dot, bin/dot-*           — dispatcher + companions
#   bin/dot.ps1, bin/dot.cmd     — Windows entrypoint + cmd shim (Scoop)
#   lib/dot/*                    — sourced helpers
#   share/man/man1/dot.1         — man page
#   share/zsh/site-functions/_dot
#   share/bash-completion/completions/dot
#   share/fish/vendor_completions.d/dot.fish
#
# The Homebrew formula in pkg/brew/dot.rb installs from this
# exact layout — keep them in lockstep.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.2.503)"
        required: true
        type: string
      dry_run:
        description: "Build, checksum, SBOM and attest, but publish nothing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Package dot CLI tarball + zip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write      # upload release assets
      id-token: write      # OIDC for keyless build-provenance attestation
      attestations: write  # write the SLSA provenance attestation
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stage layout for distribution
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          stage="dot-${VERSION}"
          bash tools/release/stage-dot.sh "$stage"

          # cmd.exe launcher for Scoop.
          {
            printf '@echo off\r\n'
            printf 'powershell -ExecutionPolicy Bypass -NoProfile -File "%%~dp0dot.ps1" %%*\r\n'
          } > "$stage/bin/dot.cmd"

          echo "=== staged layout ==="
          find "$stage" -type f | sort

      - name: Note run mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            echo "::notice::DRY RUN — every build, checksum and SBOM step runs; attestation and upload are skipped."
          else
            echo "::notice::LIVE — artefacts will be attested and uploaded to the release."
          fi

      - name: Build tarball (deterministic)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          stage="dot-${VERSION}"
          # ZIP stores DOS timestamps. Normalize the complete tree to the
          # earliest portable ZIP timestamp before either archive is built.
          find "$stage" -exec touch -h -d '1980-01-01 00:00:00 UTC' {} +
          # GNU tar deterministic flags: stable mtime, owner, sort order.
          # Without these, byte-for-byte hashes drift across runners.
          TZ=UTC tar --sort=name \
            --mtime='1970-01-01 00:00:00 UTC' \
            --owner=0 --group=0 --numeric-owner \
            -czf "dot-${VERSION}.tar.gz" "$stage"

          # Windows-friendly zip variant for Scoop. zip's `-X` strips
          # extra file attrs; `-D` skips directory entries for stable
          # hashing.
          find "$stage" -type f -print | LC_ALL=C sort \
            | zip -X -D "dot-${VERSION}.zip" -@

          echo "=== artefact sizes ==="
          ls -la "dot-${VERSION}".{tar.gz,zip}

      # Checksums over the archives, available immediately next to them
      # for consumers who only want to check their download.
      #
      # Deliberately NOT named `SHA256SUMS`: that asset name is already
      # taken by manual-publish.yml for the documentation bundle, and
      # security-release.yml waits for it. Uploading ours under that
      # name with --clobber would silently destroy the docs manifest.
      # The release-wide signed manifest remains ALL_SHA256SUMS.
      - name: Write checksums
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "dot-${VERSION}.tar.gz" "dot-${VERSION}.zip" \
            > "dot-${VERSION}.SHA256SUMS"
          cat "dot-${VERSION}.SHA256SUMS"

      # CycloneDX SBOM of the staged tree. security-release.yml emits
      # SPDX; both formats are attached because ecosystems differ in
      # which they consume.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dot-${{ steps.ver.outputs.version }}
          format: cyclonedx-json
          output-file: dot-${{ steps.ver.outputs.version }}.cyclonedx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      # Keyless sigstore bundle per archive, so a consumer can verify
      # with cosign alone — no gh CLI, no GitHub API.
      - name: Sign archives (sigstore keyless)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for asset in "dot-${VERSION}.tar.gz" "dot-${VERSION}.zip"; do
            cosign sign-blob --yes \
              --bundle "${asset}.sigstore.json" \
              "$asset"
          done
          ls -la ./*.sigstore.json

      - name: Verify the bundles we just produced
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A signature that is never verified is a signature nobody has
          # tested. Fail the build here rather than on a consumer's machine.
          for asset in "dot-${VERSION}.tar.gz" "dot-${VERSION}.zip"; do
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$asset"
          done

      # SLSA build provenance for the release artefacts. Keyless via OIDC
      # (Fulcio + Rekor); verify with `gh attestation verify dot-<v>.tar.gz
      # --repo sebastienrousseau/dotfiles`. Complements the Cosign-signed
      # SBOM + asset manifest in security-release.yml.
      - name: Attest build provenance (SLSA)
        if: ${{ inputs.dry_run != true }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dot-${{ steps.ver.outputs.version }}.tar.gz
            dot-${{ steps.ver.outputs.version }}.zip

      - name: Upload to release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dot-${VERSION}.tar.gz" \
            "dot-${VERSION}.zip" \
            "dot-${VERSION}.tar.gz.sigstore.json" \
            "dot-${VERSION}.zip.sigstore.json" \
            "dot-${VERSION}.cyclonedx.json" \
            "dot-${VERSION}.SHA256SUMS" \
            --clobber

      # Dry runs still publish the artefacts somewhere inspectable —
      # a dry run you cannot examine has not proven much.
      - name: Upload artefacts for inspection (dry run)
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-dot-${{ steps.ver.outputs.version }}
          path: |
            dot-${{ steps.ver.outputs.version }}.tar.gz
            dot-${{ steps.ver.outputs.version }}.zip
            dot-${{ steps.ver.outputs.version }}.tar.gz.sigstore.json
            dot-${{ steps.ver.outputs.version }}.zip.sigstore.json
            dot-${{ steps.ver.outputs.version }}.cyclonedx.json
            dot-${{ steps.ver.outputs.version }}.SHA256SUMS
          retention-days: 7
