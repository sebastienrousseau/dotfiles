name: Update Dependencies

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no PR created)'
        required: false
        default: 'false'
        type: boolean

# Least-privilege top-level — the update-dependencies job pushes
# branches and opens PRs; its `contents:write` + `pull-requests:write`
# are scoped to the job rather than granted workflow-wide.
permissions:
  contents: read

env:
  BRANCH_NAME: deps/auto-update-${{ github.run_number }}

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write           # push update branch
      pull-requests: write      # open PR
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure signed commits
        if: inputs.dry_run != 'true'
        env:
          ACTIONS_BOT_SIGNING_KEY: ${{ secrets.ACTIONS_BOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_BOT_SIGNING_KEY}" ]]; then
            echo "::error::Missing ACTIONS_BOT_SIGNING_KEY secret"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ACTIONS_BOT_SIGNING_KEY}" > ~/.ssh/actions_bot_signing_key
          chmod 600 ~/.ssh/actions_bot_signing_key
          git config --local gpg.format ssh
          git config --local user.signingkey ~/.ssh/actions_bot_signing_key
          git config --local commit.gpgsign true

      - name: Install tools
        run: |
          # Install jq, yq, and other tools
          bash tools/ci/install-tools.sh jq curl yq

      - name: Check for updates
        id: updates
        run: |
          UPDATES=""

          # Check Nerd Fonts version
          echo "Checking Nerd Fonts..."
          LATEST_NF=$(curl -s https://api.github.com/repos/ryanoasis/nerd-fonts/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          CURRENT_NF=$(grep -oP 'NERD_FONTS_VERSION="\K[^"]+' install/provision/run_onchange_50-install-fonts.sh 2>/dev/null || echo "unknown")
          if [[ "$LATEST_NF" != "$CURRENT_NF" && "$LATEST_NF" != "null" ]]; then
            UPDATES="${UPDATES}nerd-fonts: ${CURRENT_NF} -> ${LATEST_NF}\n"
            echo "nerd_fonts_update=true" >> $GITHUB_OUTPUT
            echo "nerd_fonts_version=$LATEST_NF" >> $GITHUB_OUTPUT
          fi

          # Not checked here: the chezmoi pin and the action pins live in
          # workflow files, which GITHUB_TOKEN cannot push (that needs the
          # `workflows` scope a token of this job cannot have), so a branch
          # carrying them was refused and the run failed every week.
          # nightly.yml reports chezmoi drift; Dependabot bumps the actions.

          if [[ -n "$UPDATES" ]]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            {
              echo "updates_summary<<EOF"
              printf '%b' "$UPDATES"
              echo
              echo "EOF"
            } >> $GITHUB_OUTPUT
            printf 'Updates found:\n%b' "$UPDATES"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No updates found"
          fi

      - name: Apply updates
        if: steps.updates.outputs.has_updates == 'true' && inputs.dry_run != 'true'
        run: |
          # Update Nerd Fonts version
          if [[ "${{ steps.updates.outputs.nerd_fonts_update }}" == "true" ]]; then
            VERSION="${{ steps.updates.outputs.nerd_fonts_version }}"
            sed -i "s/NERD_FONTS_VERSION=\"[^\"]*\"/NERD_FONTS_VERSION=\"${VERSION}\"/" install/provision/run_onchange_50-install-fonts.sh
            sed -i "s|nerd-fonts/releases/download/v[0-9.]*|nerd-fonts/releases/download/v${VERSION}|g" docs/reference/FONTS.md
          fi

      - name: Create Pull Request
        if: steps.updates.outputs.has_updates == 'true' && inputs.dry_run != 'true'
        run: |
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -S -m "chore(deps): automated dependency updates

          Updates detected and applied:
          ${{ steps.updates.outputs.updates_summary }}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "chore(deps): automated dependency updates" \
            --body "## Automated Dependency Updates

          This PR was automatically generated by the dependency update workflow.

          ### Changes
          - Nerd Fonts pinned to the latest release (installer and docs)

          ### Verification
          - [ ] CI passes
          - [ ] Shell startup time within threshold
          - [ ] Manual smoke test

          ---
          🤖 Generated automatically by [Update Dependencies](.github/workflows/update-deps.yml)" \
            --base main \
            --head "$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-neovim-plugins:
    name: Update Neovim Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Without these the job inherits the workflow's contents:read and its
    # push is refused (403) once the lockfile has changed.
    permissions:
      contents: write           # push the lockfile branch
      pull-requests: write      # open PR
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable

      - name: Update lazy.nvim lockfile
        run: |
          # Create minimal init for headless update
          mkdir -p ~/.config/nvim
          cp -r defaults/dot_config/nvim/* ~/.config/nvim/ 2>/dev/null || true

          # Run lazy update (if lazy.nvim is set up)
          nvim --headless "+Lazy! sync" +qa 2>/dev/null || echo "Lazy.nvim sync skipped"

          # Check for lockfile changes
          if [[ -f ~/.config/nvim/lazy-lock.json ]]; then
            cp ~/.config/nvim/lazy-lock.json defaults/dot_config/nvim/lazy-lock.json 2>/dev/null || true
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet defaults/dot_config/nvim/lazy-lock.json 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit plugin updates
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        env:
          ACTIONS_BOT_SIGNING_KEY: ${{ secrets.ACTIONS_BOT_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -z "${ACTIONS_BOT_SIGNING_KEY}" ]]; then
            echo "::error::Missing ACTIONS_BOT_SIGNING_KEY secret"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ACTIONS_BOT_SIGNING_KEY}" > ~/.ssh/actions_bot_signing_key
          chmod 600 ~/.ssh/actions_bot_signing_key
          git config --local gpg.format ssh
          git config --local user.signingkey ~/.ssh/actions_bot_signing_key
          git config --local commit.gpgsign true
          git checkout -b "deps/nvim-plugins-${{ github.run_number }}"
          git add defaults/dot_config/nvim/lazy-lock.json
          git commit -S -m "chore(nvim): update lazy.nvim plugin lockfile"
          git push origin "deps/nvim-plugins-${{ github.run_number }}"

          gh pr create \
            --title "chore(nvim): update plugin versions" \
            --body "Automated Neovim plugin update via lazy.nvim" \
            --base main
