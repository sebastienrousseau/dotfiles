name: Sync Versions

on:
  push:
    branches: [main, 'feat/v*']
    paths:
      - '**/*.md'
      - 'package.json'
      - 'defaults/.chezmoidata.toml'
      - 'install.sh'
      - 'scripts/version-sync.sh'
      - 'scripts/verify-release-versions'
      - 'scripts/release-preflight'
      - 'docs/operations/VERSION_SYNC.md'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'package.json'
      - 'defaults/.chezmoidata.toml'
      - 'install.sh'
      - 'scripts/version-sync.sh'
      - 'scripts/verify-release-versions'
      - 'scripts/release-preflight'
      - 'docs/operations/VERSION_SYNC.md'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target version to sync (defaults to canonical .chezmoidata.toml)'
        required: false
        type: string

# Least-privilege top-level — write is granted on the sync job
# only (it commits/pushes the version bump). Read-only verify jobs
# keep top-level read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Egress: every harden-runner step below blocks all but the endpoints
# harden-runner saw in audit mode on the last three runs of each job:
# apt mirrors for tools/ci/install-tools.sh, and github.com for checkout
# (verify runs 37544071128, 37511455725, 37506722432; sync runs
# 37001757289, 36983982516, 36705857691). The sync job also reaches
# api.github.com, where tools/ci/commit-via-api.sh creates its commit.

jobs:
  verify:
    name: Verify Version Sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          bash tools/ci/install-tools.sh jq ripgrep:rg

      - name: Verify versions
        run: ./scripts/version-sync.sh --verify

  verify-protected:
    name: Verify Version Sync (Protected Branch)
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          bash tools/ci/install-tools.sh jq ripgrep:rg

      - name: Verify versions (no auto-commit on protected branch)
        run: ./scripts/version-sync.sh --verify

  sync:
    name: Sync Version Numbers
    if: github.event_name != 'pull_request' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # createCommitOnBranch for the version-bump diff
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install dependencies
        run: |
          bash tools/ci/install-tools.sh jq ripgrep:rg

      - name: Determine target version
        id: version
        env:
          # The dispatch input reaches the shell as data and must be a
          # plain MAJOR.MINOR.PATCH before it names a commit or a file edit.
          INPUT_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            TARGET_VERSION="$INPUT_VERSION"
          else
            TARGET_VERSION="$(sed -nE 's/^[[:space:]]*dotfiles_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' defaults/.chezmoidata.toml)"
          fi
          if [[ ! "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Target version '${TARGET_VERSION}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "target_version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $TARGET_VERSION"

      - name: Sync versions
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          if [[ -n "$TARGET_VERSION" ]]; then
            ./scripts/version-sync.sh "$TARGET_VERSION"
          else
            ./scripts/version-sync.sh
          fi

      - name: Commit changes
        env:
          # GitHub signs a commit it creates for this token, so the bot's
          # commit passes the required-signatures rule on the release PR.
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bash tools/ci/commit-via-api.sh "$REF_NAME" \
            "chore: sync version references to v${TARGET_VERSION}"
