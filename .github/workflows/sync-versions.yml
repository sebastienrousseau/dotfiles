name: Sync Versions

on:
  push:
    branches: [main, 'feat/v*']
    paths:
      - '**/*.md'
      - 'package.json'
      - 'defaults/.chezmoidata.toml'
      - 'install.sh'
      - 'scripts/version-sync.sh'
      - 'scripts/verify-release-versions'
      - 'scripts/release-preflight'
      - 'docs/operations/VERSION_SYNC.md'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'package.json'
      - 'defaults/.chezmoidata.toml'
      - 'install.sh'
      - 'scripts/version-sync.sh'
      - 'scripts/verify-release-versions'
      - 'scripts/release-preflight'
      - 'docs/operations/VERSION_SYNC.md'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target version to sync (defaults to canonical .chezmoidata.toml)'
        required: false
        type: string

# Least-privilege top-level — write is granted on the sync job
# only (it commits/pushes the version bump). Read-only verify jobs
# keep top-level read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Egress: every harden-runner step below blocks all but the endpoints
# harden-runner saw in audit mode on the last three runs of each job:
# apt mirrors for tools/ci/install-tools.sh, and github.com for checkout
# and the sync job's push (verify runs 37544071128, 37511455725,
# 37506722432; sync runs 37001757289, 36983982516, 36705857691).

jobs:
  verify:
    name: Verify Version Sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          bash tools/ci/install-tools.sh jq ripgrep:rg

      - name: Verify versions
        run: ./scripts/version-sync.sh --verify

  verify-protected:
    name: Verify Version Sync (Protected Branch)
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          bash tools/ci/install-tools.sh jq ripgrep:rg

      - name: Verify versions (no auto-commit on protected branch)
        run: ./scripts/version-sync.sh --verify

  sync:
    name: Sync Version Numbers
    if: github.event_name != 'pull_request' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit + push version-bump diff
    steps:
      - name: Harden runner (block mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          bash tools/ci/install-tools.sh jq ripgrep:rg

      - name: Determine target version
        id: version
        env:
          # The dispatch input reaches the shell as data and must be a
          # plain MAJOR.MINOR.PATCH before it names a commit or a file edit.
          INPUT_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            TARGET_VERSION="$INPUT_VERSION"
          else
            TARGET_VERSION="$(sed -nE 's/^[[:space:]]*dotfiles_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' defaults/.chezmoidata.toml)"
          fi
          if [[ ! "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Target version '${TARGET_VERSION}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "target_version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $TARGET_VERSION"

      - name: Configure signed commits
        env:
          ACTIONS_BOT_SIGNING_KEY: ${{ secrets.ACTIONS_BOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_BOT_SIGNING_KEY}" ]]; then
            echo "::error::Missing ACTIONS_BOT_SIGNING_KEY secret"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ACTIONS_BOT_SIGNING_KEY}" > ~/.ssh/actions_bot_signing_key
          chmod 600 ~/.ssh/actions_bot_signing_key
          git config --local gpg.format ssh
          git config --local user.signingkey ~/.ssh/actions_bot_signing_key
          git config --local commit.gpgsign true

      - name: Sync versions
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          if [[ -n "$TARGET_VERSION" ]]; then
            ./scripts/version-sync.sh "$TARGET_VERSION"
          else
            ./scripts/version-sync.sh
          fi

      - name: Commit changes
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A
          # -s adds the DCO Signed-off-by trailer (the repo's "Check
          # sign-off" workflow requires every PR commit to carry one, so
          # without it this bot's auto-commit fails DCO on the PR it pushes
          # to). -S keeps the existing SSH signature.
          git commit -S -s -m "chore: sync version references to v${TARGET_VERSION}"
          git push origin "$REF_NAME"
