name: Reusable Test Suite

on:
  workflow_call:
    inputs:
      min_coverage:
        description: Minimum module coverage percentage.
        required: false
        default: "98"
        type: string
      run_integration:
        description: Run integration tests after unit tests.
        required: false
        default: true
        type: boolean
      run_strict_checks:
        description: Run strict apply path checks.
        required: false
        default: true
        type: boolean
      timeout_minutes:
        description: Job timeout in minutes.
        required: false
        default: 10
        type: number

permissions:
  contents: read

env:
  # The minimum chezmoi the dotfiles support (MINIMUM-TOOLCHAIN.md), as in
  # ci.yml and the reliability gate.
  CHEZMOI_VERSION: "2.72.2"

jobs:
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tests that render chezmoi templates (the zshrc, alias layers,
      # gitconfig, installer paths) skip without chezmoi, so without this
      # step they never ran here.
      - name: Setup chezmoi
        uses: ./.github/actions/setup-chezmoi

      # The fish tests (functions, completions, startup) skip without fish,
      # and Ubuntu packages fish 3.7, below the 4.0 floor. Install the
      # upstream self-contained Linux build, pinned and checksum-verified
      # (the hash matches GitHub's recorded digest for the asset).
      - name: Install fish (pinned release, SHA-256 verified)
        env:
          FISH_VERSION: 4.9.3
          FISH_SHA256: 8f643d10ad1abb0ef7072764c01ceb5cf61b2d373fda400cf60f0bad69b7e095
        run: |
          set -euo pipefail
          asset="fish-${FISH_VERSION}-linux-x86_64.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/fish-shell/fish-shell/releases/download/${FISH_VERSION}/${asset}"
          echo "${FISH_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/fish-bin"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/fish-bin" fish
          echo "$RUNNER_TEMP/fish-bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/fish-bin/fish" --version

      - name: Unit tests (zero-failure policy)
        run: |
          set -euo pipefail
          chmod +x tests/framework/*.sh
          echo "Running unit tests (real coverage is gated by Coverage / kcov; see #856)..."

          TOTAL_SCRIPTS="$(find scripts -name "*.sh" | wc -l)"
          echo "Found $TOTAL_SCRIPTS testable shell scripts"

          # `--jobs auto` honours #867 parallelism. Invariance under
          # parallel execution is pinned by
          # `tests/regression/test_runner_parallel_invariant.sh`.
          ./tests/framework/test_runner.sh --jobs auto 2>&1 | tee test_output.log

          FAILED_TESTS="$(
            grep -a "Total failed:" test_output.log \
              | tail -1 \
              | sed -E 's/\x1b\[[0-9;]*m//g' \
              | sed -E 's/.*Total failed:[[:space:]]*([0-9]+).*/\1/' \
              || echo 0
          )"

          if [[ "$FAILED_TESTS" -gt 0 ]]; then
            echo "❌ COVERAGE THRESHOLD FAILED: $FAILED_TESTS failed tests detected"
            echo "Zero-failure policy enforced - all tests must pass"
            exit 1
          fi

          echo "✅ All tests passed"

      - name: Enforce module coverage
        run: |
          set -euo pipefail
          bash tools/ci/install-tools.sh ripgrep:rg
          chmod +x tests/framework/module_coverage.sh
          MIN_COVERAGE="${{ inputs.min_coverage }}" ./tests/framework/module_coverage.sh

      - name: Integration tests
        if: inputs.run_integration == true
        run: |
          set -euo pipefail
          echo "Running integration tests..."
          RUN_INTEGRATION=1 ./tests/framework/test_runner.sh --jobs auto --integration-only 2>&1 | tee integration_output.log

          INTEGRATION_FAILED="$(
            grep -a "Total failed:" integration_output.log \
              | tail -1 \
              | sed -E 's/\x1b\[[0-9;]*m//g' \
              | sed -E 's/.*Total failed:[[:space:]]*([0-9]+).*/\1/' \
              || echo 0
          )"
          if [[ "$INTEGRATION_FAILED" -gt 0 ]]; then
            echo "❌ Integration tests failed: $INTEGRATION_FAILED failures"
            exit 1
          fi

          echo "✅ Integration tests passed"

      - name: Strict-mode apply path checks
        if: inputs.run_strict_checks == true
        env:
          DOTFILES_ALIAS_STRICT_MODE: "1"
        run: |
          set -euo pipefail
          echo "Running strict-mode apply path checks..."
          REPO_ROOT="$PWD" bash tests/unit/aliases/test_alias_strict_mode.sh
          REPO_ROOT="$PWD" bash tests/unit/ops/test_ops_chezmoi_apply.sh
          REPO_ROOT="$PWD" bash tests/unit/install/test_install_lib_chezmoi.sh
