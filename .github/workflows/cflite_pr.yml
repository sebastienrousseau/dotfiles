name: ClusterFuzzLite / PR

# Builds the ClusterFuzzLite fuzzers on pull requests that touch them, so
# the .clusterfuzzlite build (the one OSS-Fuzz runs) cannot break unseen,
# and keeps the integration the OpenSSF Scorecard "Fuzzing" check detects.
#
# It does not run the fuzzers. run_fuzzers looked up a saved corpus for
# each of the 14 targets by paging through every Actions artifact in the
# repository (9,661 when this changed), about 46 s a target and minutes
# when the API returned 502, to find nothing: no job uploads a corpus. The
# job timed out at 20 minutes for about 9 s of fuzzing per target. The
# fuzzing runs in fuzz.yml instead: every harness, 60 s each, natively.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"

permissions: read-all

jobs:
  build:
    name: ClusterFuzzLite / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
