# Dependency Review — PR-time supply-chain gate.
#
# Blocks pull requests that introduce dependencies with known
# vulnerabilities or disallowed licenses, using GitHub's dependency graph
# diff for the PR. Complements Dependabot (which bumps) and CodeQL/secret
# scanning (which inspect code) by gating the *change* itself.
#
# Requires the repository Dependency Graph to be enabled (it is — Dependabot
# is active).

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Security / Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
