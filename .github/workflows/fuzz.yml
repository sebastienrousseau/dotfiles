name: Fuzz / Native Go harnesses

# Two gates:
#
#   replay  — on every push and PR, every committed corpus (seed entries
#             plus the minimized crashers of previously-fixed findings) is
#             replayed with `go test -run '^Fuzz'`. No fuzzing, no flakes:
#             a fixed crash cannot silently come back.
#   fuzz    — a short fuzzing window per harness on PRs that touch an input
#             parsing surface, to catch regressions before they merge.
#
# Harnesses live in three places:
#   fuzz            ports of the shell helpers and of
#                                        the two Go binaries' parsers
#   defaults/dot_local/share/dot-ui      in-module, against the real code
#   defaults/dot_local/share/dot-ai-tui  in-module, against the real code
#   defaults/dot_local/share/dot-mcp     in-module, the MCP wire protocol
#
# Pairs with the OSS-Fuzz / ClusterFuzzLite integration in
# fuzz/oss-fuzz/, which runs the ported harnesses continuously at
# scale on Google infra. See docs/security/FUZZING.md.

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'lib/dot/utils.sh'
      - 'scripts/dot/commands/init.sh'
      - 'fuzz/**'
      - 'defaults/dot_local/share/dot-ui/**'
      - 'defaults/dot_local/share/dot-ai-tui/**'
      - 'defaults/dot_local/share/dot-mcp/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Per-harness fuzz duration (e.g. 60s, 5m, 1h)'
        required: false
        default: '60s'
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic gate: replay every committed corpus in every module.
  replay:
    name: Fuzz / Replay corpus (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oss-fuzz ports
            dir: fuzz
          - name: dot-ui
            dir: defaults/dot_local/share/dot-ui
          - name: dot-ai-tui
            dir: defaults/dot_local/share/dot-ai-tui
          - name: dot-mcp
            dir: defaults/dot_local/share/dot-mcp
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Replay seed + regression corpus
        working-directory: ${{ matrix.dir }}
        run: go test -run '^Fuzz' -v ./...

  # The OSS-Fuzz builder compiles each harness from ONE rewritten _test.go
  # file, without the package's other test files. `go test` cannot see that
  # constraint, so a harness referencing a sibling test file passes every
  # local gate and fails only inside the ClusterFuzzLite container. This
  # job reproduces the constraint in seconds.
  harness-layout:
    name: Fuzz / Harness self-containment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fuzz/go.mod
          cache-dependency-path: fuzz/go.sum

      - name: Each harness must build without its sibling test files
        run: bash tools/ci/check-fuzz-harness-self-contained.sh

  # Short fuzzing window per harness.
  fuzz:
    name: Fuzz / ${{ matrix.harness }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ports of the shell input handling.
          - harness: FuzzValidateName
            dir: fuzz
          - harness: FuzzInitURLResolver
            dir: fuzz
          # dot-ui, in-module against the real implementation.
          - harness: FuzzParseEvent
            dir: defaults/dot_local/share/dot-ui
          - harness: FuzzStepApply
            dir: defaults/dot_local/share/dot-ui
          - harness: FuzzParseColor
            dir: defaults/dot_local/share/dot-ui
          - harness: FuzzFuzzyMatch
            dir: defaults/dot_local/share/dot-ui
          - harness: FuzzPickKeys
            dir: defaults/dot_local/share/dot-ui
          - harness: FuzzRunTable
            dir: defaults/dot_local/share/dot-ui
          - harness: FuzzReadItems
            dir: defaults/dot_local/share/dot-ui
          - harness: FuzzParsePickArgs
            dir: defaults/dot_local/share/dot-ui
          # dot-ai-tui, in-module against the real implementation.
          - harness: FuzzHighlight
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzBuildPrompt
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzHandleSlash
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzPalette
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzWindowRows
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzRenderTranscript
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzParseSession
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzFilterSqliteOutput
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzGatewayURL
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzModelKeys
            dir: defaults/dot_local/share/dot-ai-tui
          - harness: FuzzModelCycle
            dir: defaults/dot_local/share/dot-ai-tui
          # dot-mcp, in-module: everything a peer can put on the wire.
          - harness: FuzzReadFrames
            dir: defaults/dot_local/share/dot-mcp
          - harness: FuzzDecodeRequest
            dir: defaults/dot_local/share/dot-mcp
          - harness: FuzzValidateArgs
            dir: defaults/dot_local/share/dot-mcp
          - harness: FuzzServeSession
            dir: defaults/dot_local/share/dot-mcp
          - harness: FuzzBuildCallResult
            dir: defaults/dot_local/share/dot-mcp
          # Ports of the two binaries' parsers — what OSS-Fuzz builds.
          - harness: FuzzUIEventLine
            dir: fuzz
          - harness: FuzzUIHexColor
            dir: fuzz
          - harness: FuzzUIPickFilter
            dir: fuzz
          - harness: FuzzUIPickArgs
            dir: fuzz
          - harness: FuzzUITableRows
            dir: fuzz
          - harness: FuzzAISessionFile
            dir: fuzz
          - harness: FuzzAISqliteOutput
            dir: fuzz
          - harness: FuzzAIFenceTag
            dir: fuzz
          - harness: FuzzAIGatewayURL
            dir: fuzz
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false

      - name: Run ${{ matrix.harness }}
        working-directory: ${{ matrix.dir }}
        env:
          FUZZTIME: ${{ inputs.fuzztime || '60s' }}
        run: |
          go test -run '^$' -fuzz='^${{ matrix.harness }}$' \
            -fuzztime="$FUZZTIME" ./...

      - name: Upload reproducer corpus if failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducer-${{ matrix.harness }}
          path: ${{ matrix.dir }}/testdata/fuzz/
          retention-days: 14
