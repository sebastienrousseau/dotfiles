name: CodeQL

on:
  push:
    # No path filter on push: SAST must run on EVERY commit to the default
    # branch (OpenSSF Scorecard counts the share of commits a SAST tool ran on).
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '.github/workflows/**'
  merge_group:
    branches: [main]
    # NOTE: `paths:` is not honored under merge_group — actionlint warns
    # if present. Merge-queue runs always execute the full workflow.
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday with main CI

# Cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege top-level — Scorecard's Token-Permissions check
# flags any non-`read` token granted at the workflow level. The
# write scope CodeQL needs (`security-events: write` to upload the
# SARIF) is granted on the analyze job only.
permissions:
  contents: read

jobs:
  analyze:
    name: Security / CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload-sarif
      actions: read
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: actions,python
      - name: Perform Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
