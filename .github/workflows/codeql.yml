name: CodeQL

on:
  push:
    # No path filter on push: SAST must run on EVERY commit to the default
    # branch (OpenSSF Scorecard counts the share of commits a SAST tool ran on).
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '.github/workflows/**'
  merge_group:
    branches: [main, master]
    # NOTE: `paths:` is not honored under merge_group — actionlint warns
    # if present. Merge-queue runs always execute the full workflow.
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday with main CI

# Cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege top-level — Scorecard's Token-Permissions check
# flags any non-`read` token granted at the workflow level. The
# write scope CodeQL needs (`security-events: write` to upload the
# SARIF) is granted on the analyze job only.
permissions:
  contents: read

jobs:
  analyze:
    name: Security / CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload-sarif
      actions: read
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: actions,python
      - name: Perform Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
