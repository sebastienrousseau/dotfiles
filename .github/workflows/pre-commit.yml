name: Pre-Commit Hooks

# Runs the repository-wide hooks that are deterministic in a single runner.
# Shell, Lua, container, secret, and custom policy checks are enforced by
# their dedicated workflows; this job owns YAML, Markdown, spelling, and
# GitHub Actions linting without duplicating those heavier gates.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Python (for pre-commit + yamllint)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node.js (for markdownlint-cli2)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Setup Go (for actionlint)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('config/pre-commit-config.yaml') }}

      - name: Run pre-commit (yamllint hook)
        run: pre-commit run yamllint --all-files --config config/pre-commit-config.yaml --show-diff-on-failure

      - name: Run pre-commit (markdownlint-cli2 hook)
        run: pre-commit run markdownlint-cli2 --all-files --config config/pre-commit-config.yaml --show-diff-on-failure

      - name: Run pre-commit (typos hook)
        run: pre-commit run typos --all-files --config config/pre-commit-config.yaml --show-diff-on-failure

      - name: Run pre-commit (actionlint hook)
        run: pre-commit run actionlint --all-files --config config/pre-commit-config.yaml --show-diff-on-failure
