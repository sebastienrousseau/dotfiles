name: Enhanced Security Pipeline

on:
  push:
    branches: [main, main]
    # Only run security scans when security-relevant files change
    paths:
      - '**.sh'
      - '**.tmpl'
      - 'install/**'
      - 'scripts/security/**'
      - '.github/workflows/security*.yml'
      - '**/Dockerfile*'
      - 'config/gitleaks.toml'
      - '.github/security-policies/**'
  pull_request:
    branches: [main, main]
    paths:
      - '**.sh'
      - '**.tmpl'
      - 'install/**'
      - 'scripts/security/**'
      - '.github/workflows/security*.yml'
      - '**/Dockerfile*'
      - 'config/gitleaks.toml'
      - '.github/security-policies/**'
  merge_group:
    branches: [main, main]
    # NOTE: `paths:` is ignored under merge_group; merge-queue runs
    # always execute the full security pipeline regardless of changes.
  schedule:
    # Weekly security scan on Sunday 2 AM UTC (reduced from daily)
    - cron: '0 2 * * 0'
  workflow_dispatch:

# Least-privilege top-level — Scorecard's Token-Permissions check
# flags any non-`read` token granted at the workflow level. The
# write scopes are granted on jobs that actually need them
# (security-events: write for SARIF upload, attestations: write
# on the attestation job).
permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Security scanning tool versions
  TRIVY_VERSION: "0.68.2"
  COSIGN_VERSION: "2.2.3"
  GRYPE_VERSION: "0.104.3"

jobs:
  # ============================================================================
  # STAGE 1: SECRETS & CREDENTIAL SCANNING (Always runs - critical)
  # ============================================================================

  secrets-scan:
    name: Security / Secrets Detection
    uses: sebastienrousseau/dotfiles/.github/workflows/reusable-secrets-scan.yml@07dcd2aca29d8abb0710292318e820a031cb62db # main
    with:
      run_guard: true
      run_additional_patterns: false
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  secrets-trufflehog:
    name: Security / TruffleHog OSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secrets-scan]
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  # ============================================================================
  # STAGE 2: DEPENDENCY VULNERABILITY SCANNING (Schedule/manual only - expensive)
  # ============================================================================

  dependency-scan:
    name: Security / Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload Grype SARIF
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Grype DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: grype-db-${{ runner.os }}-

      - name: Scan for vulnerabilities with Grype
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.cache/grype:/grype-cache" \
            -w /work \
            "anchore/grype:v${{ env.GRYPE_VERSION }}" \
            dir:/work --output sarif --file /work/grype-results.sarif --fail-on critical

      - name: Upload Grype results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: grype-results.sarif
          category: grype-analysis

  # ============================================================================
  # STAGE 3: INFRASTRUCTURE SECURITY SCANNING (Schedule/manual only)
  # ============================================================================

  infrastructure-scan:
    name: Security / Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # upload Checkov SARIF
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          output_format: sarif
          output_file_path: checkov-results.sarif
          framework: dockerfile,yaml,secrets
          quiet: true
          soft_fail: true
          # OSS-Fuzz scaffolding can't satisfy CKV_DOCKER_2/3/7 — see ci-enforced.yml.
          skip_path: fuzz/oss-fuzz/

      - name: Upload Checkov results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: checkov-results.sarif
          category: checkov-analysis

  # ============================================================================
  # STAGE 4: CONTAINER SECURITY SCANNING (Manual/tagged only)
  # ============================================================================

  container-scan:
    name: Security / Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run container scans manually or with explicit tag
    if: contains(github.event.head_commit.message, '[container]') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test container
        if: hashFiles('**/Dockerfile*') != ''
        run: docker build -f tests/Dockerfile.test -t dotfiles-test:latest .

      - name: Scan container with Trivy
        if: hashFiles('**/Dockerfile*') != ''
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -w /work \
            "aquasec/trivy:${{ env.TRIVY_VERSION }}" \
            image --security-checks vuln,config,secret --format sarif --output /work/container-scan.sarif dotfiles-test:latest

      - name: Upload container scan results
        if: always() && hashFiles('**/Dockerfile*') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: container-scan.sarif
          category: container-analysis

  # ============================================================================
  # STAGE 5: POLICY ENFORCEMENT (PRs only)
  # ============================================================================

  policy-enforcement:
    name: Security / Policy Enforcement
    uses: sebastienrousseau/dotfiles/.github/workflows/reusable-security-baseline.yml@4a5da70c897f41c7a7fc24f4cd74ab30c03d37b5 # main
    needs: [secrets-scan]
    # Only run on PRs to catch issues before merge
    if: github.event_name == 'pull_request'
    with:
      run_dependency_audit: false
      run_supply_chain_checks: false
      run_permission_audit: true

  # ----------------------------------------------------------------------------
  # The job above is named "Policy Enforcement" but never ran
  # scripts/security/enforce-policies.sh — it calls a reusable baseline whose
  # permission audit sets `issues=1`, echoes a warning and then exits 0, so it
  # cannot fail. The script itself ran nowhere: it is declared in
  # config/pre-commit-config.yaml at `stages: [pre-push]`, but this repository
  # installs hand-written .git/hooks (not pre-commit-managed ones, and they
  # never call pre-commit), and the Pre-Commit workflow runs five hooks by name
  # and not this one. This job is where it actually executes.
  # ----------------------------------------------------------------------------

  policy-script:
    name: Security / Policy Script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secrets-scan]
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the script runs gitleaks in git mode, and
          # .gitleaksignore entries are fingerprinted
          # `<commit>:<file>:<rule>:<line>`. On a shallow checkout those commits
          # are absent, so every allowlisted false positive would come back.
          fetch-depth: 0

      - name: Install shellcheck
        run: bash tools/ci/install-tools.sh shellcheck

      - name: Install gitleaks and opa
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          OPA_VERSION: 1.20.2
          OPA_SHA256: 69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Pinned by version AND checksum. install-tools.sh is apt-based and
          # neither tool is an apt package, so these come from their releases.
          curl -fsSL --retry 3 --max-time 120 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks

          curl -fsSL --retry 3 --max-time 120 -o "$HOME/.local/bin/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $HOME/.local/bin/opa" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opa"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Enforce security policies
        run: |
          set -euo pipefail
          # STRICT: a missing tool becomes an error rather than a skip. The
          # script tolerates absent tools so a contributor without opa still
          # gets the other checks; CI provisions all three, so here a skip
          # means provisioning broke and must fail loudly.
          DOTFILES_POLICY_STRICT=1 ./scripts/security/enforce-policies.sh

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: security-policy-report
          path: |
            security-report.md
            .security-audit.log
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # STAGE 6: SECURITY ATTESTATION (main branch only, schedule)
  # ============================================================================

  security-attestation:
    name: Security / Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secrets-scan]
    # Only generate attestations on schedule for main branch
    if: github.event_name == 'schedule' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate security attestation
        run: |
          cat > security-attestation.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "scans_completed": ["secrets"],
            "tools_used": ["gitleaks"],
            "security_controls": {
              "secrets_scanning": true,
              "sarif_upload": true
            }
          }
          EOF

      - name: Attest security scan
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: security-attestation.json

      - name: Upload security attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-attestation-${{ github.sha }}
          path: security-attestation.json
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - dependency-scan
      - infrastructure-scan
      - policy-enforcement
      - policy-script
    if: always()
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Security summary
        run: |
          for result in \
            "${{ needs.secrets-scan.result }}" \
            "${{ needs.dependency-scan.result }}" \
            "${{ needs.infrastructure-scan.result }}" \
            "${{ needs.policy-enforcement.result }}" \
            "${{ needs.policy-script.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Security workflow contains a failing mandatory job"
              exit 1
            fi
          done
          echo "Security workflow passed"
