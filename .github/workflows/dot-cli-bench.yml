name: Dot CLI Cold-Start Bench

# Runs the dot CLI cold-start gate on every PR and push to main.
# Complements the weekly perf-baseline (shell-startup) workflow — this
# one is fast (<30s) and specifically targets the `dot` dispatcher
# cold-start, which is the user-visible cost of every `dot` invocation.
#
# Budget: 150ms median-of-11 on Linux, 200ms on macOS, 300ms on Windows.
# Per-OS budgets reflect runner-cost differences (Windows tools are
# slowest, Linux tools are fastest). Local macOS bash 5.x hits ~47ms
# so this leaves comfortable headroom while still catching regressions.
# Ratchet each budget down as improvements land (track in ROADMAP §C5).

on:
  push:
    branches: [main]
    paths:
      - 'bin/dot'
      - 'plugins/cli/libexec/hook.sh'
      - 'tools/ci/hook-bench.sh'
      - 'scripts/dot/**'
      - 'tools/ci/dot-cli-startup-bench.sh'
      - 'benches/dot_command_bench.sh'
      - 'benches/run-cases.txt'
      - 'docs/reference/FEATURE-MATRIX.md'
      - '.github/workflows/dot-cli-bench.yml'
  pull_request:
    paths:
      - 'bin/dot'
      - 'plugins/cli/libexec/hook.sh'
      - 'tools/ci/hook-bench.sh'
      - 'scripts/dot/**'
      - 'tools/ci/dot-cli-startup-bench.sh'
      - 'benches/dot_command_bench.sh'
      - 'benches/run-cases.txt'
      - 'docs/reference/FEATURE-MATRIX.md'
      - '.github/workflows/dot-cli-bench.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: dot CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            budget_ms: 150
          - os: macos-latest
            budget_ms: 200
    timeout-minutes: 5
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cold-start gate
        env:
          DOT_BENCH_BUDGET_MS: ${{ matrix.budget_ms }}
          DOT_BENCH_RUNS: 11
          DOT_BENCH_CMD: version
        run: bash tools/ci/dot-cli-startup-bench.sh

  # The agent hook: Claude Code, Gemini CLI and Codex run it on every prompt,
  # tool call and stop, so it is gated per event at p95 over 100 events.
  # Linux holds the 30ms target. macOS pays ~3ms per process spawn and the
  # hook spawns three (bash, jq, mv): 20ms is its floor on an M-series Mac
  # and 30ms its p95 there; hosted runners are slower and noisier, so 60ms
  # catches a new fork without flaking.
  hook:
    name: agent hook / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            budget_ms: 30
          - os: macos-latest
            budget_ms: 60
    timeout-minutes: 5
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hook-bench times with $EPOCHREALTIME (bash 5); the runner's bash is
      # Apple's 3.2. Homebrew's bash goes first on PATH, as on a machine
      # these dotfiles set up, so the hook runs under it too.
      - name: Put bash 5 first on PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"

      - name: Run the hook p95 gate
        env:
          DOT_HOOK_BENCH_BUDGET_MS: ${{ matrix.budget_ms }}
        run: bash tools/ci/hook-bench.sh

  # Breadth sweep: every routed command, not just `dot version`. The gate
  # above is the asserted one; this job RECORDS timings so a regression in a
  # single command's cold start cannot hide behind one representative
  # command, and uploads the JSON as an artifact for trend comparison.
  #
  # Deliberately not asserted. Per fix(bench) 73b788f0, a single command's
  # wall clock on these runners is not measurable to better than roughly
  # ±25% between sessions, and a threshold that fails on when it happens to
  # run teaches people to ignore the check. The calibrated thresholds stay
  # in the scripts that own them.
  sweep:
    name: dot CLI sweep / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The full sweep is 257 cases and the slow ones (doctor, score,
    # smoke-test) are seconds each: ~17min measured locally while the
    # regression suite ran alongside it. 45 leaves room on a cold runner.
    timeout-minutes: 45
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hyperfine
        # The sweep falls back to a portable median-of-N loop without it, but
        # hyperfine does the warmup and the statistics properly.
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) bash tools/ci/install-tools.sh hyperfine ;;
            Darwin) brew install hyperfine ;;
          esac

      - name: Benchmark every command
        run: |
          bash benches/dot_command_bench.sh \
            --full --runs 3 --output dot-command-bench.json

      - name: Verify every command was covered
        # The sweep is only meaningful if it actually reached every command;
        # this is the assertion the job does make.
        run: bash ./scripts/qa/check-feature-matrix.sh --quiet

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-command-bench-${{ matrix.os }}
          path: dot-command-bench.json
          retention-days: 30
