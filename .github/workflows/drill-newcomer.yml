name: Drill A1 / Newcomer

# A first-time user on a fresh machine: run the README's Install and Quick
# Start blocks as written, then `dot doctor --json`, which must report no
# failures, within the time budget (tools/ci/drill-newcomer.sh). The
# installer is the published release the README pins, so this checks what
# a reader of the README gets today. The one exception is a release pull
# request, whose README pins the installer it is about to publish and the
# signed tag it clones: there the drill runs this branch's install.sh,
# still checked against the README's digest, on this branch's source.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'install.sh'
      - 'tools/ci/drill-newcomer.sh'
      - '.github/workflows/drill-newcomer.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'install.sh'
      - 'tools/ci/drill-newcomer.sh'
      - '.github/workflows/drill-newcomer.yml'
  release:
    types: [published]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: Drill A1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Above the drill's own 20-minute budget, so a slow run fails with the
    # drill's reason rather than being cancelled.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every event, not only pull requests: after a release pull request
      # merges, main's README pins the installer of a release that is not
      # published until its signed tag is, and the push run would 404.
      - name: Use this branch's installer if the pinned one is unpublished
        run: |
          set -euo pipefail
          url="$(bash tools/ci/drill-newcomer.sh --print |
            grep -oE 'https://github\.com/[^ ]+/dotfiles-install-[0-9.]+\.sh' | head -1 || true)"
          if [[ -z "$url" ]]; then
            echo "::error::the README's Install block names no installer to download"
            exit 1
          fi
          if ! curl -fsIL -o /dev/null "$url"; then
            echo "::notice::$url is not published yet (a release not yet cut); running this branch's install.sh, checked against the README's digest, on this branch's source"
            echo "DRILL_INSTALLER=$GITHUB_WORKSPACE/install.sh" >>"$GITHUB_ENV"
            # The installer clones the signed release tag, which does not
            # exist until the release is published. A checkout already at
            # ~/.dotfiles is the installer's own local-source path, so it
            # applies this branch instead; signature checks are unchanged.
            cp -R "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          fi

      - name: Run the README as a newcomer would
        run: bash tools/ci/drill-newcomer.sh

      # When the doctor reports the chezmoi state drifted, the drill's
      # verdict cannot say what drifted; this does.
      - name: Show what chezmoi sees as drifted
        if: failure()
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi status || true
          chezmoi diff --no-pager 2>/dev/null | head -n 120 || true
