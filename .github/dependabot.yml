version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    ignore:
      # This repo's own reusable workflows are pinned by SHA, so Dependabot
      # sees each call site as a github-actions dependency and opens a PR
      # whenever main moves. But .github/workflows/bump-reusable-pins.yml
      # already owns that job: it runs on every push to main touching a
      # reusable-*.yml and opens a single PR bumping every stale caller.
      #
      # With both active, each merge to main regenerated up to seven
      # near-identical PRs, which in turn moved main again. Nothing required
      # them: tools/ci/lint-reusable-pins.sh only enforces that a pin is an
      # immutable 40-hex SHA, never that it matches main, so a pin that
      # trails main by a few commits is valid and safe.
      #
      # Third-party actions are unaffected and still bumped normally.
      - dependency-name: "sebastienrousseau/dotfiles/.github/workflows/*"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "UTC"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
