version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "docker"
    # Docker manifests live below the repository root. Dependabot does not
    # recurse from `directory: "/"`; that stale scope fails with
    # dependency_file_not_found instead of checking any image dependency.
    directories:
      - "/.clusterfuzzlite"
      - "/.devcontainer"
      - "/fuzz/oss-fuzz"
      - "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    # Ubuntu tags here are intentional platform contracts (24.04 LTS and
    # 26.04 LTS), not application versions. Preserve those release lines;
    # digest-only refreshes remain eligible because they are not SemVer tag
    # updates.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "UTC"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # The Go modules and the Rust crate had no Dependabot coverage, so a
  # vulnerable dependency there raised no alert and no update PR.
  - package-ecosystem: "gomod"
    directories:
      - "/core"
      - "/fuzz"
      - "/defaults/dot_local/share/dot-ai-tui"
      - "/defaults/dot_local/share/dot-mcp"
      - "/defaults/dot_local/share/dot-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/lib/wasm-tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
