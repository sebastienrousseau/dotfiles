name: 'mise-toolchain'
description: >-
  Install the toolchain the dotfiles deploy. Puts mise (pinned by version
  and SHA-256) on PATH, copies defaults/dot_config/mise/conf.d/*.toml to
  ~/.config/mise/conf.d/ (where chezmoi deploys them), runs `mise install`
  outside the checkout (so the repo-root mise.toml cannot shadow the global
  layer) and fails if any configured tool is missing afterwards. It reads
  whatever the conf.d files pin; it assumes no tool names, versions or
  settings. Needs a prior actions/checkout.

inputs:
  github-token:
    description: Token for mise's GitHub API calls (via `gh auth token`).
    required: true

runs:
  using: composite
  steps:
    - name: Install mise (pinned, checksum-verified)
      shell: bash
      env:
        # SHA-256 from the release's SHASUMS256.txt, cross-checked against
        # the downloaded assets. Published 2026-11-10, older than the 7-day
        # release-age policy when pinned.
        MISE_VERSION: "2026.11.6"
        MISE_SHA256_LINUX_X64: d6ebb6f5601bdf5a8d1d56028b24fe575f45075b989941ccc920f95161c5fa28
        MISE_SHA256_MACOS_ARM64: 74cf55e92f6c6b1f166781c36db35db9420a4cbf40d62d85c1b9d5dc76e0ba72
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target=linux-x64 sha="$MISE_SHA256_LINUX_X64" ;;
          macOS-ARM64) target=macos-arm64 sha="$MISE_SHA256_MACOS_ARM64" ;;
          *) echo "::error::no pinned mise checksum for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        tmp="$(mktemp -d)"
        asset="mise-v${MISE_VERSION}-${target}.tar.gz"
        curl -fsSL --retry 3 --max-time 300 -o "$tmp/$asset" \
          "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/${asset}"
        echo "${sha}  $tmp/$asset" | shasum -a 256 -c -
        tar -xzf "$tmp/$asset" -C "$tmp"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$tmp/mise/bin/mise" "$HOME/.local/bin/mise"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/mise" --version

    - name: Deploy the conf.d base layer
      shell: bash
      run: |
        set -euo pipefail
        # Same target path chezmoi deploys to; global config, so trusted.
        conf_dir="$HOME/.config/mise/conf.d"
        mkdir -p "$conf_dir"
        cp defaults/dot_config/mise/conf.d/*.toml "$conf_dir/"
        ls -l "$conf_dir"

    - name: mise install
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # The config authenticates GitHub API calls via `gh auth token`,
        # which reads GH_TOKEN.
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_YES: "1"
      run: |
        set -euo pipefail
        mise install --jobs 4

    - name: Every configured tool is installed
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        missing="$(mise ls --current --missing)"
        if [[ -n "$missing" ]]; then
          echo "::error::mise reports configured tools that are not installed"
          printf '%s\n' "$missing"
          exit 1
        fi
        mise ls --current
