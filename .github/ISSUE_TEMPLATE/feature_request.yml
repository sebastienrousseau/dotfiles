name: Feature request
description: Suggest a change to dot, a plugin or the dotfiles.
labels: ["type:enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The command, flag or behaviour you would like, with an example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - dot CLI
        - AI tools and agents
        - Themes and appearance
        - Shells and aliases
        - Security and secrets
        - Install and packaging
        - Documentation
        - Other
    validations:
      required: true
