# Gitleaks Configuration
#
# This file configures gitleaks to ignore known false positives.
# These are example/placeholder secrets used in documentation.
#
# References:
#   - Gitleaks: https://github.com/gitleaks/gitleaks

title = "Dotfiles Gitleaks Configuration"

[extend]
# Use the default gitleaks config as a base
useDefault = true

# Allowlist patterns that are known false positives.
#
# NOTE: this is the `[[allowlists]]` array form. The singular `[allowlist]`
# table is deprecated upstream, and gitleaks >= 8.30 refuses to load a
# config that mixes the two — so every allowlist here must use this form.
[[allowlists]]
description = "Allowlisted patterns for documentation examples"

# Example secrets used in documentation
regexes = [
    # Example hex values commonly used in documentation
    '''cafebabe:deadbeef''',
    '''cafebabe''',
    '''deadbeef''',

    # Example AWS keys with XXX indicating they're fake
    '''AKIAIMNOJVGFDXXXE4OA''',

    # Sidekiq enterprise example
    '''BUNDLE_ENTERPRISE__CONTRIBSYS__COM''',

    # GPG public key fingerprints used for signature verification (not secrets)
    '''CHEZMOI_GPG_KEY=''',

]

# Paths to ignore (documentation files with examples)
paths = [
    # detect-secrets stores one-way hashes of reviewed false positives. Those
    # hashes are scanner metadata, not retrievable credentials.
    '''\.secrets\.baseline''',
    '''docs/.*\.md''',
    '''\.github/.*\.md''',
    '''\.github/security-policies/environment-template\.env''',
    # Security tests deliberately embed secret-shaped patterns to prove the
    # atuin history filter / scanners catch them — not real secrets.
    '''tests/unit/secrets/.*\.sh''',
]

# Specific commits to ignore (false positives from GPG public key fingerprint)
commits = [
    "c26337708b2c87e0f240c643d203da45eb687aff",
    "499ba965458e0052c01bc4fc71c8a2be43a70b3b",
]

# Stopwords - common words that appear in secrets but are not secrets
stopwords = [
    "example",
    "test",
    "sample",
    "placeholder",
    "dummy",
    "fake",
]

# ─────────────────────────────────────────────────────────────────────────
# SSH public-key fingerprints in documentation.
#
# `git tag -v`, `git log --show-signature` and `ssh-keygen -lf` all print
# a key fingerprint as `SHA256:` + 43 base64 characters. KEYS.asc and
# pkg/VERIFY.md quote that output so a reader can compare what they get
# against what they should get.
#
# A fingerprint is a hash of a PUBLIC key, published deliberately so that
# anyone can verify our signatures — GitHub serves the same keys from
# /users/<user>/ssh_signing_keys. It authenticates nobody. gitleaks'
# generic-api-key rule matches it only because the base64 entropy is high
# (4.8) and the word "key" sits next to it.
#
# This is a separate allowlist because it needs `regexTarget = "line"`:
# the rule's captured secret is the bare base64 run, without the
# `SHA256:` prefix, so matching the secret alone would mean allowlisting
# *any* 43-character base64 string — which is the shape of plenty of real
# credentials. Requiring the `SHA256:` prefix on the line keeps this
# narrow, and leaves KEYS.asc otherwise fully scanned: a private key
# pasted into it would still be caught.
[[allowlists]]
description = "SSH public-key fingerprints (SHA256:...) quoted in verification docs"
regexTarget = "line"
regexes = [
    '''SHA256:[A-Za-z0-9+/]{43}''',
]

# Additional patterns to detect
[[rules]]
id = "aws-session-token"
description = "AWS Session Token"
regex = '''(?i)aws.{0,20}session.{0,20}token.{0,20}['"][0-9a-zA-Z/+=]{16,}['"]'''
tags = ["aws", "token"]

[[rules]]
id = "gcp-api-key"
description = "GCP API Key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
tags = ["gcp", "api"]

[[rules]]
id = "azure-connection-string"
description = "Azure Connection String"
regex = '''(?i)DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[^;]+'''
tags = ["azure", "connection"]
