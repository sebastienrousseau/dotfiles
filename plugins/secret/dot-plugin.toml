#
# Command names of dot secret (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-secret.
schema = "cli/manifest.v1"
name = "secret"
domain = "secret"
version = "0.2.536"
summary = "secrets, keys and SSH certificates"
default = "status"

[[objects]]
name = "key"
summary = "SSH signing and authentication keys"
default = "list"

[[objects]]
name = "cert"
summary = "short-lived SSH certificates"
default = "list"

[[objects]]
name = "provider"
summary = "the secret provider"
default = "show"

[[commands]]
verb = "status"
effect = "read"
summary = "Provider, vault state and key counts"

[[commands]]
verb = "init"
effect = "write"
summary = "Set up the secret provider"

[[commands]]
verb = "edit"
effect = "write"
summary = "Edit the encrypted secrets file"

[[commands]]
verb = "new"
effect = "write"
summary = "Create the secrets file"

[[commands]]
verb = "list"
effect = "read"
summary = "Secret names without values"

[[commands]]
verb = "show"
effect = "read"
summary = "One secret"

[[commands]]
verb = "set"
effect = "write"
summary = "Store one secret"

[[commands]]
verb = "export"
effect = "read"
summary = "Print secrets as environment"

[[commands]]
verb = "check"
effect = "read"
summary = "Audit secret hygiene"

[[commands]]
object = "key"
verb = "list"
effect = "read"
summary = "Keys without their values"

[[commands]]
object = "key"
verb = "new"
effect = "write"
summary = "Create an ED25519 key"

[[commands]]
object = "cert"
verb = "list"
effect = "read"
summary = "Certificates and expiry"

[[commands]]
object = "cert"
verb = "new"
effect = "write"
summary = "Issue a short-lived SSH certificate"

[[commands]]
object = "provider"
verb = "show"
effect = "read"
summary = "The active provider"

[[commands]]
object = "provider"
verb = "set"
effect = "write"
summary = "Switch provider"

[[aliases]]
name = "secrets-init"
target = "secret init"
kind = "deprecated"
until = "0.2.538"

[[aliases]]
name = "secrets"
target = "secret edit"
kind = "deprecated"
until = "0.2.538"

[[aliases]]
name = "secrets-create"
target = "secret new"
kind = "deprecated"
until = "0.2.538"

[[aliases]]
name = "ssh-key"
target = "secret key new"
kind = "deprecated"
until = "0.2.538"

[[aliases]]
name = "ssh-cert"
target = "secret cert new"
kind = "deprecated"
until = "0.2.538"

[[aliases]]
name = "secret-audit"
target = "secret check"
kind = "deprecated"
until = "0.2.538"
