#
# Command names of dot ui (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-ui.
schema = "cli/manifest.v1"
name = "ui"
domain = "ui"
version = "0.2.540"
summary = "primitives for scripts"
default = "show"

[[objects]]
name = "table"
summary = "render a table"
default = "show"

[[commands]]
verb = "show"
effect = "read"
summary = "The primitives on offer"

[[commands]]
verb = "select"
effect = "read"
summary = "Interactive picker for scripts"

[[commands]]
verb = "run"
effect = "write"
lock = false
summary = "Run a command with progress"

[[commands]]
object = "table"
verb = "show"
effect = "read"
summary = "Render rows as a table"
