#
# Command names of dot attest (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-attest.
schema = "cli/manifest.v1"
name = "attest"
domain = "attest"
version = "0.2.539"
summary = "attestation and verification"
default = "show"

[entry]
command = "dot-attest"
fallback = true

[[commands]]
verb = "show"
effect = "read"
summary = "The workstation attestation"

[[commands.flags]]
long = "json"
short = "j"
summary = "Print JSON"

[[commands.flags]]
long = "write"
short = "w"
summary = "Write the attestation to a file"

[[commands]]
verb = "export"
effect = "read"
summary = "Write attestation evidence"

[[commands]]
verb = "verify"
effect = "read"
summary = "Verify evidence"

[[aliases]]
name = "attestation"
target = "attest"
kind = "removed"
until = "0.2.538"
