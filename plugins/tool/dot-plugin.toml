#
# Command names of dot tool (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-tool.
schema = "cli/manifest.v1"
name = "tool"
domain = "tool"
version = "0.2.536"
summary = "toolchains, packages, project templates"
default = "list"
legacy = "env"

[[commands]]
verb = "list"
effect = "read"
legacy = "env list"
summary = "Toolchains and their versions"

[[commands]]
verb = "install"
effect = "write"
legacy = "env install"
summary = "Install the configured toolchains"

[[commands]]
verb = "update"
effect = "write"
legacy = "env upgrade"
summary = "Upgrade toolchains"

[[commands]]
verb = "remove"
effect = "write"
legacy = "env prune"
summary = "Remove orphaned toolchains (a dry run without --yes)"

[[commands]]
verb = "set"
effect = "write"
legacy = "env use"
summary = "Pin a toolchain version"

[[commands]]
verb = "export"
effect = "read"
legacy = "env emit"
summary = "Print the tool environment"

[[commands]]
verb = "new"
effect = "write"
legacy = "new"
summary = "Create a project from a template"

[commands.args]
values = ["python", "go", "node", "packer", "molecule"]

[[aliases]]
name = "env"
target = "tool"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "tools"
target = "tool list --nix"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "packages"
target = "tool list --packages"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "locks"
target = "tool list --locked"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "new"
target = "tool new"
kind = "removed"
until = "0.2.538"
