#
# Command names of dot system (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-system.
schema = "cli/manifest.v1"
name = "system"
domain = "system"
version = "0.2.536"
summary = "updates, cleanup, scheduled maintenance"
default = "status"

[[objects]]
name = "schedule"
summary = "scheduled maintenance jobs"
default = "list"

[[objects]]
name = "settings"
summary = "OS settings dot manages"
default = "show"

[[commands]]
verb = "status"
effect = "read"
legacy = "system status"
summary = "OS, disk, schedule and last run"

[[commands]]
verb = "update"
effect = "write"
legacy = "upgrade"
summary = "Update everything, asking first"

[[commands.flags]]
long = "yes"
short = "y"
summary = "Answer yes to every question"

[[commands.flags]]
long = "globals"
summary = "Also update npm, cargo and pipx globals"

[[commands]]
verb = "clean"
effect = "write"
summary = "Reclaim space, asking first"

[[commands]]
verb = "show"
effect = "read"
summary = "Hardware and host details"

[[commands]]
object = "schedule"
verb = "list"
effect = "read"
legacy = "system schedule list"
summary = "Scheduled jobs"

[[commands]]
object = "schedule"
verb = "set"
effect = "write"
legacy = "system schedule set"
summary = "Set the maintenance schedule"

[commands.args]
values = ["weekly", "daily", "off"]

[[commands]]
object = "schedule"
verb = "run"
effect = "write"
legacy = "system schedule run"
summary = "Run scheduled maintenance now"

[[commands]]
object = "settings"
verb = "show"
effect = "read"
summary = "Current OS settings"

[[commands]]
object = "settings"
verb = "apply"
effect = "write"
legacy = "tune"
summary = "Apply the managed OS settings"

[[aliases]]
name = "update"
target = "system update"
kind = "shortcut"

[[aliases]]
name = "upgrade"
target = "system update"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "tune"
target = "system settings apply"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "log-rotate"
target = "system clean --logs"
kind = "removed"
until = "0.2.538"
