#
# Command names of dot cli (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-cli.
schema = "cli/manifest.v1"
name = "cli"
domain = "cli"
version = "0.2.543"
summary = "plugins, updates, completions"
default = "list"

[entry]
command = "dot-cli"

[[objects]]
name = "completion"
summary = "shell completion scripts"
default = "show"

[[objects]]
name = "registry"
summary = "the plugin registry"
default = "show"

[[objects]]
name = "hook"
summary = "agent hook events (agent-event.v1)"
default = "status"

[[commands]]
verb = "list"
effect = "read"
summary = "Installed plugins"

[[commands]]
verb = "show"
effect = "read"
summary = "One plugin in detail"

[[commands]]
verb = "install"
effect = "write"
summary = "Install a plugin"

[[commands]]
verb = "update"
effect = "write"
planned = true
summary = "Update dot and its plugins"

[[commands]]
verb = "remove"
effect = "write"
planned = true
summary = "Remove a plugin"

[[commands]]
verb = "verify"
effect = "read"
planned = true
summary = "Verify plugin provenance"

[[commands]]
verb = "new"
effect = "write"
planned = true
summary = "Create a plugin from the template"

[[commands]]
object = "completion"
verb = "show"
effect = "read"
summary = "Print a completion script"

[[commands]]
object = "registry"
verb = "show"
effect = "read"
summary = "The plugin registry URL"

[[commands]]
object = "registry"
verb = "set"
effect = "write"
summary = "Point at another plugin registry"

[[commands]]
object = "hook"
verb = "status"
effect = "read"
summary = "Each agent session's last state"

# The receiver an agent's hook runs (`dot cli hook run`; N5 keeps the bare
# object read-only). Agents fire hooks concurrently and must never wait on
# dot: no lock (N17).
[[commands]]
object = "hook"
verb = "run"
effect = "write"
lock = false
summary = "Record an agent hook event read on stdin"

# The policy check an agent's PreToolUse (Gemini: BeforeTool) hook runs
# (ADR-025): read-only, so it takes no domain lock (N17).
[[commands]]
object = "hook"
verb = "check"
effect = "read"
summary = "Check a tool call against the AI policy"

[[commands]]
object = "hook"
verb = "install"
effect = "write"
summary = "Wire the hook into each agent's configuration"

[[commands]]
object = "hook"
verb = "remove"
effect = "write"
summary = "Take the hook out of each agent's configuration"

[[aliases]]
name = "completion"
target = "cli completion"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "registry"
target = "cli list --available"
kind = "removed"
until = "0.2.538"
legacy = "registry list"

[[aliases]]
name = "search"
target = "help"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "manual"
target = "help --manual"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "docs"
target = "help --readme"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "learn"
target = "help tour"
kind = "removed"
until = "0.2.538"
