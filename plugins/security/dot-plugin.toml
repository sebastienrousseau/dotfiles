#
# Command names of dot security (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-security.
schema = "cli/manifest.v1"
name = "security"
domain = "security"
version = "0.2.536"
summary = "OS hardening"
default = "status"

[entry]
command = "dot-security"

[[objects]]
name = "policy"
summary = "the security policy"
default = "show"

[[objects]]
name = "disk"
summary = "disk encryption"
default = "show"

[[objects]]
name = "firewall"
summary = "the firewall"
default = "show"

[[objects]]
name = "telemetry"
summary = "OS telemetry"
default = "show"

[[objects]]
name = "dns"
summary = "encrypted DNS"
default = "show"

[[objects]]
name = "lock"
summary = "the lock screen"
default = "show"

[[objects]]
name = "usb"
summary = "removable media"
default = "show"

[[objects]]
name = "score"
summary = "the security score"
default = "show"

[[commands]]
verb = "status"
effect = "read"
planned = true
summary = "Hardening summary"

[[commands]]
object = "policy"
verb = "show"
effect = "read"
summary = "The security policy"

[[commands]]
object = "disk"
verb = "show"
effect = "read"
summary = "Disk encryption state"

[[commands]]
object = "score"
verb = "show"
effect = "read"
summary = "The security score"

[[commands.flags]]
long = "verbose"
short = "v"
summary = "Show detailed scoring"

[[commands.flags]]
long = "quiet"
short = "q"
summary = "Reduce output"

[[commands.flags]]
long = "json"
short = "j"
summary = "Print a JSON summary"

[[commands]]
object = "firewall"
verb = "show"
effect = "read"
planned = true
summary = "Current firewall setting"

[[commands]]
object = "firewall"
verb = "apply"
effect = "write"
summary = "Harden the firewall setting"

[[commands]]
object = "telemetry"
verb = "show"
effect = "read"
planned = true
summary = "Current telemetry setting"

[[commands]]
object = "telemetry"
verb = "apply"
effect = "write"
summary = "Harden the telemetry setting"

[[commands]]
object = "dns"
verb = "show"
effect = "read"
planned = true
summary = "Current dns setting"

[[commands]]
object = "dns"
verb = "apply"
effect = "write"
summary = "Harden the dns setting"

[[commands]]
object = "lock"
verb = "show"
effect = "read"
planned = true
summary = "Current lock setting"

[[commands]]
object = "lock"
verb = "apply"
effect = "write"
summary = "Harden the lock setting"

[[commands]]
object = "usb"
verb = "show"
effect = "read"
planned = true
summary = "Current usb setting"

[[commands]]
object = "usb"
verb = "apply"
effect = "write"
summary = "Harden the usb setting"

[[aliases]]
name = "policy"
target = "security policy"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "encrypt-check"
target = "security disk"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "firewall"
target = "security firewall apply"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "telemetry"
target = "security telemetry apply"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "dns-doh"
target = "security dns apply"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "lock-screen"
target = "security lock apply"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "usb-safety"
target = "security usb apply"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "security-score"
target = "security score"
kind = "removed"
until = "0.2.538"
