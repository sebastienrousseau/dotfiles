#
# Command names of dot shell (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-shell.
schema = "cli/manifest.v1"
name = "shell"
domain = "shell"
version = "0.2.541"
summary = "aliases, history, startup caches"
default = "status"

[entry]
command = "dot-shell"

[[objects]]
name = "history"
summary = "shell history"
default = "list"

[[objects]]
name = "alias"
summary = "aliases and their sources"
default = "list"

[[commands]]
verb = "status"
effect = "read"
planned = true
summary = "Shell, startup time and cache state"

[[commands]]
verb = "update"
effect = "write"
summary = "Regenerate the startup caches"

[[commands]]
verb = "clean"
effect = "write"
summary = "Clear the startup caches"

[[commands]]
object = "history"
verb = "list"
effect = "read"
summary = "Recent history"

[[commands]]
object = "alias"
verb = "list"
effect = "read"
summary = "Aliases and where each is defined; a term searches them"

[[commands]]
object = "alias"
verb = "check"
effect = "read"
summary = "Find shadowed or broken aliases"

[[commands]]
object = "alias"
verb = "show"
effect = "read"
summary = "Where one alias comes from"

[[commands]]
object = "alias"
verb = "status"
effect = "read"
summary = "Alias counts; --tiers for the ecosystem tiers"

[[commands.flags]]
long = "tiers"
summary = "Show which ecosystem tiers are enabled"

[[commands]]
object = "alias"
verb = "export"
effect = "read"
summary = "Write the alias cheatsheet"

[[aliases]]
name = "cd"
target = "config path"
kind = "shortcut"

[[aliases]]
name = "history"
target = "shell history"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "aliases"
target = "shell alias"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "alias-check"
target = "shell alias check"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "cache-refresh"
target = "shell update"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "prewarm"
target = "shell update --prewarm"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "clean-cache"
target = "shell clean"
kind = "removed"
until = "0.2.538"
