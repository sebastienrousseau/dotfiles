#
# Command names of dot session (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-session. Sessions are the agent runtime's
# terminals (lib/dot/agent-runtime.sh): herdr-core's, else tmux sessions.
schema = "cli/manifest.v1"
name = "session"
domain = "session"
version = "0.2.545"
summary = "find, open and restore terminal sessions"
default = "select"

[entry]
command = "dot-session"

[[commands]]
verb = "select"
effect = "read"
summary = "Pick a session to open"

[[commands]]
verb = "list"
effect = "read"
summary = "Sessions on this machine"

[[commands]]
verb = "new"
effect = "write"
summary = "Start a named session"

[[commands.flags]]
long = "cwd"
value = "dir"
summary = "The directory it starts in"

[[commands]]
verb = "open"
effect = "read"
summary = "Attach to a session"

[[commands]]
verb = "stop"
effect = "write"
summary = "End a session"

[[commands]]
verb = "restore"
effect = "write"
planned = true
summary = "Restore saved sessions"
