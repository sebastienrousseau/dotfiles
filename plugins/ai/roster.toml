#
# The AI roster: every tool `dot ai` knows, in one place (plan v3, T0).
# tools/docs/gen_roster.py generates every other list from this file and
# `--check` fails CI when one has drifted:
#
#   plugins/ai/roster.json                       roster.v1 for dot-top
#   lib/dot/data/ai-roster.sh                    names, binaries, packages
#   plugins/ai/dot-plugin.toml                   `dot ai start` values
#   defaults/dot_local/bin/executable_tmux-ai    providers it launches
#   defaults/dot_local/share/dot-ai-tui/roster_gen.go   the cockpit list
#
# Fields:
#   name       what users type: `dot ai start <name>`
#   bin        the executable on PATH
#   aliases    other names that select the tool
#   title      display name; summary: one line on what it is
#   group      cockpit section: agents, coding, general, local, cloud, ecosystem
#   role       process-table role in the cockpit
#   processes  process names that belong to the tool (default: bin)
#   package    mise package, a key of [ai_tools] in defaults/.chezmoidata.toml;
#              absent when a native installer or the user installs it
#   native     the installer function in lib/dot/ai-install.sh, when not mise
#   chat       false for suite tools that are not agents (no start, no prompt)
#   fleet      false to keep an installable binary out of the cockpit list
schema = "ai/roster.v1"

[[tool]]
name = "claude"
bin = "claude"
title = "Claude Code"
summary = "Anthropic's flagship agentic coder"
native = "install_claude_native"
aliases = ["cl"]
group = "agents"
role = "agent"

