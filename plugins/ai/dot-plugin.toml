#
# Command names of dot ai (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-ai.
schema = "cli/manifest.v1"
name = "ai"
domain = "ai"
version = "0.2.536"
summary = "install, route and run coding agents"
default = "tui"
legacy = "ai"

[[objects]]
name = "pattern"
summary = "prompt patterns"
default = "list"

[[objects]]
name = "cost"
summary = "spend by agent and model"
default = "show"

[[objects]]
name = "gateway"
summary = "the keyless gateway"
default = "show"

[[objects]]
name = "inventory"
summary = "installed agents and versions"
default = "show"

[[commands]]
verb = "list"
effect = "read"
legacy = "ai tools"
summary = "Installed agents"

[[commands]]
verb = "install"
effect = "write"
legacy = "ai install"
summary = "Install agents"

[[commands]]
verb = "update"
effect = "write"
legacy = "ai update"
summary = "Upgrade agent CLIs"

[[commands]]
verb = "start"
effect = "write"
legacy = "ai chat"
summary = "Start an agent"

[commands.args]
values = ["claude", "codex", "copilot", "goose", "crush", "amp", "cursor-agent", "grok", "kimi", "agy", "kiro", "sgpt", "ollama", "opencode", "aider", "autohand", "vibe", "qwen", "zai"]

[[commands]]
verb = "run"
effect = "write"
legacy = "ai run"
summary = "Run an agent once"

[[commands.flags]]
long = "pattern"
short = "p"
value = "pattern"
summary = "Steering pattern"

[commands.args]
values = ["claude", "codex", "copilot", "goose", "crush", "amp", "cursor-agent", "grok", "kimi", "agy", "kiro", "sgpt", "ollama", "opencode", "aider", "autohand", "vibe", "qwen", "zai"]

[[commands]]
object = "gateway"
verb = "serve"
effect = "read"
legacy = "ai serve"
summary = "Run the gateway in the foreground"

[[commands]]
verb = "login"
effect = "write"
legacy = "ai login"
summary = "Authenticate an agent"

[[commands]]
verb = "check"
effect = "read"
legacy = "ai doctor"
summary = "Check agent installs and auth"

[[commands]]
verb = "ask"
effect = "read"
legacy = "ai ask"
summary = "Ask about the local context"

[[commands]]
object = "pattern"
verb = "list"
effect = "read"
legacy = "patterns list"
summary = "Prompt patterns"

[[commands]]
object = "cost"
verb = "show"
effect = "read"
legacy = "ai cost"
summary = "Spend by agent and model"

[[commands]]
object = "gateway"
verb = "show"
effect = "read"
summary = "Gateway statistics"

[[commands]]
object = "inventory"
verb = "show"
effect = "read"
summary = "Agents, versions and config"

[[aliases]]
name = "ai-setup"
target = "ai install --interactive"
kind = "deprecated"
until = "0.2.538"

[[aliases]]
name = "ai-query"
target = "ai ask"
kind = "deprecated"
until = "0.2.538"

