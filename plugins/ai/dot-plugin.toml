#
# Command names of dot ai (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-ai.
schema = "cli/manifest.v1"
name = "ai"
domain = "ai"
version = "0.2.536"
summary = "install, route and run coding agents"
default = "tui"

[[objects]]
name = "pattern"
summary = "prompt patterns"
default = "list"

[[objects]]
name = "cost"
summary = "spend by agent and model"
default = "show"

[[objects]]
name = "gateway"
summary = "the keyless gateway"
default = "show"

[[objects]]
name = "inventory"
summary = "installed agents and versions"
default = "show"

[[commands]]
verb = "list"
effect = "read"
summary = "Installed agents"

[[commands]]
verb = "install"
effect = "write"
summary = "Install agents"

[[commands]]
verb = "update"
effect = "write"
summary = "Upgrade agent CLIs"

[[commands]]
verb = "start"
effect = "write"
summary = "Start an agent"

[[commands]]
verb = "run"
effect = "write"
summary = "Run an agent once"

[[commands]]
verb = "serve"
effect = "read"
summary = "Run the gateway in the foreground"

[[commands]]
verb = "login"
effect = "write"
summary = "Authenticate an agent"

[[commands]]
verb = "check"
effect = "read"
summary = "Check agent installs and auth"

[[commands]]
verb = "ask"
effect = "read"
summary = "Ask about the local context"

[[commands]]
object = "pattern"
verb = "list"
effect = "read"
summary = "Prompt patterns"

[[commands]]
object = "cost"
verb = "show"
effect = "read"
summary = "Spend by agent and model"

[[commands]]
object = "gateway"
verb = "show"
effect = "read"
summary = "Gateway statistics"

[[commands]]
object = "inventory"
verb = "show"
effect = "read"
summary = "Agents, versions and config"

[[aliases]]
name = "ai-setup"
target = "ai install --interactive"
kind = "deprecated"
until = "0.2.538"

[[aliases]]
name = "ai-query"
target = "ai ask"
kind = "deprecated"
until = "0.2.538"

