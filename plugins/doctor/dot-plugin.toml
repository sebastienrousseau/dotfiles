# Command names of dot doctor (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-doctor.
schema = "cli/manifest.v1"
name = "doctor"
domain = "doctor"
version = "0.2.536"
summary = "health, repair, backup and rollback"
default = "status"

[[objects]]
name = "score"
summary = "the setup score"
default = "show"

[[objects]]
name = "snapshot"
summary = "setup snapshots"
default = "list"

[[objects]]
name = "perf"
summary = "startup performance"
default = "show"

[[objects]]
name = "drift"
summary = "drift from the source"
default = "show"

[[objects]]
name = "conflict"
summary = "conflicting files"
default = "list"

[[objects]]
name = "metric"
summary = "recorded metrics"
default = "list"

[[objects]]
name = "report"
summary = "the weekly posture report"
default = "show"

[[commands]]
verb = "status"
effect = "read"
summary = "Health summary"

[[commands]]
verb = "check"
effect = "read"
summary = "Run every health check"

[[commands]]
verb = "fix"
effect = "write"
summary = "Repair what check found"

[[commands]]
verb = "backup"
effect = "write"
summary = "Back up the setup"

[[commands]]
verb = "restore"
effect = "write"
summary = "Restore from a backup"

[[commands]]
verb = "rollback"
effect = "write"
summary = "Return to a previous generation"

[[commands]]
object = "score"
verb = "show"
effect = "read"
summary = "The setup score"

[[commands]]
object = "snapshot"
verb = "list"
effect = "read"
summary = "Snapshots"

[[commands]]
object = "snapshot"
verb = "new"
effect = "write"
summary = "Take a snapshot"

[[commands]]
object = "perf"
verb = "show"
effect = "read"
summary = "Startup timings"

[[commands]]
object = "perf"
verb = "measure"
effect = "read"
summary = "Benchmark startup"

[[commands]]
object = "drift"
verb = "show"
effect = "read"
summary = "Drift from the source"

[[commands]]
object = "conflict"
verb = "list"
effect = "read"
summary = "Conflicting files"

[[commands]]
object = "metric"
verb = "list"
effect = "read"
summary = "Recorded metrics"

[[commands]]
object = "report"
verb = "show"
effect = "read"
summary = "Weekly posture report"

