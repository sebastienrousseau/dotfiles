#
# Command names of dot doctor (ADR-020), checked by tools/ci/check-cli-contract.py.
# Repository at extraction: dot-doctor.
schema = "cli/manifest.v1"
name = "doctor"
domain = "doctor"
version = "0.2.536"
summary = "health, repair, backup and rollback"
default = "status"

[entry]
command = "dot-doctor"
fallback = true

[[objects]]
name = "score"
summary = "the setup score"
default = "show"

[[objects]]
name = "snapshot"
summary = "setup snapshots"
default = "list"

[[objects]]
name = "perf"
summary = "startup performance"
default = "show"

[[objects]]
name = "drift"
summary = "drift from the source"
default = "show"

[[objects]]
name = "conflict"
summary = "conflicting files"
default = "list"

[[objects]]
name = "metric"
summary = "recorded metrics"
default = "list"

[[objects]]
name = "report"
summary = "the weekly posture report"
default = "show"

[[commands]]
verb = "status"
effect = "read"
summary = "Health summary"

[[commands.flags]]
long = "verbose"
short = "v"
summary = "Show detailed checks"

[[commands.flags]]
long = "json"
short = "j"
summary = "Print a JSON summary"

[[commands.flags]]
long = "fix"
short = "f"
summary = "Apply common fixes"

[[commands.flags]]
long = "force"
short = "F"
summary = "Apply fixes without prompts"

[[commands]]
verb = "check"
effect = "read"
summary = "Run every health check"

[[commands.flags]]
long = "heal"
short = "H"
summary = "Repair common issues"

[[commands.flags]]
long = "score"
short = "s"
summary = "Show the score"

[[commands.flags]]
long = "json"
short = "j"
summary = "Print a JSON summary"

[[commands.flags]]
long = "ai"
short = "A"
summary = "Include AI diagnostics"

[[commands]]
verb = "fix"
effect = "write"
summary = "Repair what check found"

[[commands]]
verb = "backup"
effect = "write"
summary = "Back up the setup"

[[commands]]
verb = "restore"
effect = "write"
summary = "Restore from a backup"

[[commands.flags]]
long = "list"
short = "l"
summary = "List available backups"

[[commands.flags]]
long = "latest"
short = "L"
summary = "Restore the latest backup"

[[commands.flags]]
long = "git"
short = "g"
value = "ref"
summary = "Restore from a git ref"

[[commands.flags]]
long = "diff"
short = "d"
value = "ref"
summary = "Show a diff for a git ref"

[[commands.flags]]
long = "dry-run"
short = "n"
summary = "Preview the restore"

[[commands]]
verb = "rollback"
effect = "write"
summary = "Return to a previous generation"

[[commands]]
object = "score"
verb = "show"
effect = "read"
summary = "The setup score"

[[commands]]
object = "snapshot"
verb = "list"
effect = "read"
planned = true
summary = "Snapshots"

[[commands]]
object = "snapshot"
verb = "new"
effect = "write"
summary = "Take a snapshot"

[[commands.flags]]
long = "baseline"
short = "b"
summary = "Capture the baseline snapshot"

[[commands.flags]]
long = "force"
short = "f"
summary = "Overwrite an existing snapshot"

[[commands]]
object = "perf"
verb = "show"
effect = "read"
summary = "Startup timings"

[[commands.flags]]
long = "json"
short = "j"
summary = "Print JSON"

[[commands.flags]]
long = "profile"
short = "p"
summary = "Include profile output"

[[commands.flags]]
long = "runs"
short = "r"
value = "count"
summary = "Number of runs"

[[commands.flags]]
long = "target"
short = "t"
value = "ms"
summary = "Timing target in milliseconds"

[[commands]]
object = "perf"
verb = "measure"
effect = "read"
summary = "Benchmark startup"

[[commands]]
object = "drift"
verb = "show"
effect = "read"
summary = "Drift from the source"

[[commands]]
object = "conflict"
verb = "list"
effect = "read"
summary = "Conflicting files"

[[commands]]
object = "metric"
verb = "list"
effect = "read"
summary = "Recorded metrics"

[[commands]]
object = "report"
verb = "show"
effect = "read"
planned = true
summary = "Weekly posture report"

[[aliases]]
name = "health"
target = "doctor"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "health-check"
target = "doctor"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "scorecard"
target = "doctor score"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "score"
target = "doctor score"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "snapshot"
target = "doctor snapshot new"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "perf"
target = "doctor perf"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "benchmark"
target = "doctor perf --profile"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "load-bench"
target = "doctor perf --ready"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "load-bench-pty"
target = "doctor perf --ready --pty"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "rollback"
target = "doctor rollback"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "heal"
target = "doctor fix"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "drift"
target = "doctor drift"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "conflicts"
target = "doctor conflict"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "restore"
target = "doctor restore"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "metrics"
target = "doctor metric"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "backup"
target = "doctor backup"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "chaos"
target = "doctor"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "smoke-test"
target = "doctor"
kind = "removed"
until = "0.2.538"

[[aliases]]
name = "keys"
target = "doctor"
kind = "removed"
until = "0.2.538"
