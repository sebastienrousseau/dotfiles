# mise (runtime manager) configuration — DOTFILES-MANAGED BASE LAYER
# https://mise.jdx.dev/
#
# This file lives in conf.d/ (loaded first, lowest precedence) and is the
# read-only base config deployed by chezmoi. The writable global config
# `~/.config/mise/config.toml` is intentionally NOT chezmoi-managed (see
# .chezmoiignore): that's where `mise use -g` / `mise upgrade` write their
# version pins. Splitting them this way stops mise's mutable writes from
# perpetually drifting the chezmoi-managed source. User pins in
# config.toml override these defaults. Don't move tool defaults back into
# config.toml or the drift returns.

[settings]
# Release cooldown: a floating version ("latest", "3.4", "26") resolves to
# the newest release at least seven days old, so a compromised release has
# a week to be caught before it reaches this machine. The gate applies to
# version resolution only: an exact pin ("1.3.2") installs that release
# whatever its age, and so do the trust tools and AI CLIs pinned below.
# First-party tools (github:sebastienrousseau/*) carry a per-tool
# minimum_release_age = "0s" so `mise latest` and `dot system update` see
# their newest release at once (minimum_release_age_excludes takes exact
# names only, no globs, in mise 2026.11).
minimum_release_age = "7d"
# Never install a missing tool behind a shim call or `mise exec`: tools
# install only through an explicit `mise install` (dot system update,
# dot ai install, heal-tools).
auto_install = false
# Ensure mise tool paths/shims are placed ahead of system PATH
activate_aggressive = true
# Use verbose output
verbose = false
# Use precompiled ruby binaries (silences 2026.8.0 warning)
ruby.compile = false
# Tolerate slow crates.io/index responses (default 20s is too tight)
fetch_remote_versions_timeout = "60s"
# Large release assets (ollama's linux tarball is ~1.5 GB) can outlast the
# default 30m when GitHub serves them slowly; the install then fails.
http_download_timeout = "2h"
# Authenticate mise's own GitHub API calls through gh. mise runs the command
# only when it needs a token and keeps the result in-process; nothing is
# exported, so child processes never inherit it (see the [env] note below).
# Without it, anonymous calls share a 60-requests-per-hour budget that one
# `mise install` lockfile refresh can exhaust, and later calls fail with 403.
github.credential_command = "gh auth token"

[tools]
# Node.js
node = "26"

# Python
python = ["3.12", "3.14", "3.15"]

# Go
go = "latest"
# govulncheck is the native Go audit that ~/Code/AGENTS.md §0 runs in every
# Go repository, and gopls's run_govulncheck uses it too. Without it the
# audit fails with "command not found" on any machine where nobody has run
# `go install` by hand.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# Rust -- deliberately NOT managed by mise.
#
# mise's rust plugin exports RUSTUP_TOOLCHAIN, and that environment
# variable overrides `rust-toolchain.toml` in every project, silently.
# A repository pinned to 1.98.0 was being built with 1.97.1: clippy
# reported an unknown lint for one that only exists in 1.98, and a
# local "all green" did not mean CI would be green.
#
# rustup is installed and ~/.cargo/bin is on PATH, so rustup governs
# instead and each project's own pin is honoured. Re-adding
# `rust = "latest"` here brings the override back.

# Ruby
ruby = "3.4"

# Java
java = "25"

# Deno
deno = "latest"

# Bun
bun = "latest"

# Zig
zig = "latest"

# CLI Tools
atuin = "latest"
bat = "latest"
codex = "0.170.0"
# corralctl, passmcp, and draft — the AI Ecosystem & Governance Suite,
# managed and updated globally via mise (`github:sebastienrousseau/...`).
"github:sebastienrousseau/corralctl" = { version = "0.0.54", minimum_release_age = "0s" }
"github:sebastienrousseau/passmcp" = { version = "0.0.10", minimum_release_age = "0s" }
"github:sebastienrousseau/passmcp-graph" = { version = "0.0.10", minimum_release_age = "0s" }
"github:sebastienrousseau/passmcp-lsp" = { version = "0.0.10", minimum_release_age = "0s" }
"github:sebastienrousseau/passmcp-server" = { version = "0.0.10", minimum_release_age = "0s" }
"github:sebastienrousseau/draft" = { version = "0.0.47", minimum_release_age = "0s" }
eza = "latest"
gping = "latest"
# pandoc builds the HTML/PDF/EPUB manual. Without it tools/docs/build-manual.sh
# exits 1 at the "building HTML single page" step with "No version is set for
# shim: pandoc", so `dot doctor`'s manual check reports a missing local build on
# any machine that has not installed it by hand. Managed here rather than in
# config.toml (which is chezmoi-ignored) so every machine can build the docs,
# not just the one where someone ran `mise use -g`.
pandoc = "latest"
ripgrep = "latest"
ruff = "latest"
# Required by current nvim-treesitter to build its managed parsers.
"aqua:tree-sitter/tree-sitter" = "latest"
yazi = "26.9.1"
zellij = "0.46.0"
zoxide = "latest"
"aqua:twpayne/chezmoi" = "2.74.1"
"aqua:junegunn/fzf" = "latest"
"aqua:FiloSottile/age" = "1.3.2"
# minisign verifies the `dot registry` index (registry-trust.sh) and runs in
# tools/ci/check-registry.sh. Without it those checks stop with "minisign is
# required" on any machine where nobody installed it by hand. It is also how
# to check a Zig tarball's .minisig by hand when `mise lock` doesn't record
# its provenance.
minisign = "0.12"
# hyperfine intentionally NOT managed by mise: the aqua package for
# sharkdp/hyperfine only ships an x86_64 macOS binary, so on Apple
# Silicon without Rosetta the mise shim is unrunnable ("Bad CPU type in
# executable"), which silently breaks `dot doctor`'s startup benchmark.
# It's provided natively by Brewfile.cli (arm64) and by Linux package
# managers instead.
"aqua:ollama/ollama" = "0.40.16"
"aqua:Nukesor/pueue/pueue" = "4.0.4"
"aqua:Nukesor/pueue/pueued" = "4.0.4"
wasmtime = "50.0.2"
sops = "3.13.3"
"aqua:dandavison/delta" = "latest"
fd = "latest"
"aqua:ClementTsang/bottom" = "latest"
"npm:tldr" = "3.5.0"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:jesseduffield/lazydocker" = "latest"
"aqua:charmbracelet/gum" = "latest"
"aqua:charmbracelet/glow" = "latest"
"aqua:charmbracelet/mods" = "latest"
starship = "latest"

# Python tools
"pipx:poetry" = "2.5.1"
uv = "0.13.7"
# aider supports Python 3.9-3.12. On 3.13+ it crashes at import: pydub
# (aider's voice support) needs the stdlib audioop module, removed in 3.13.
# uv builds aider's environment on 3.12 regardless of the default Python.
"pipx:aider-chat" = { version = "0.86.2", uvx_args = "--python 3.12" }

# AI tools
# "npm:@anthropic-ai/claude-code" = "latest"  # disabled 2026-06-04: npm 11 skips the platform-native optionalDependency on global installs, breaking the binary. Use Anthropic's native installer instead (~/.local/bin/claude, self-updating).
"npm:@github/copilot" = "1.0.114"
# antigravity-cli (agy) is installed via native curl installer, not npm:
# curl -fsSL https://antigravity.google/cli/install.sh | bash
# codex provided by the native `codex` pin above; `npm:codex-cli` was an
# unrelated legacy package (codex.js) that collided on the `codex` bin name.
# opencode: native pin below (folded in from the retired ~/mise.toml).
# `npm:opencode-ai` is a redundant duplicate using the broken npm optional-dep
# wrapper pattern — do not reintroduce it.
opencode = "1.19.6"
"npm:autohand-cli" = "0.9.11"
"npm:@qwen-code/qwen-code" = "0.28.0"
"npm:@guizmo-ai/zai-cli" = "0.3.5"
# "pipx:mistral-vibe" = "latest"  # disabled 2026-05-12: dep `mistralai` quarantined on PyPI; re-enable when restored

# Editor tooling. Global npm packages live inside each Node version's
# directory, so `npm install -g` ones vanished on every Node switch; as mise
# tools they survive it. prettierd is the daemon conform.nvim calls (the old
# prettier_d package is deprecated and shipped another binary).
"npm:eslint_d" = "15.1.0"
"npm:@fsouza/prettierd" = "0.29.0"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.3"

# Task runners
task = "latest"
just = "latest"

# Nushell (structured-data shell). The bare `nushell` name isn't in
# mise's tool registry; the aqua: backend resolves it from the official
# release tarballs.
"aqua:nushell/nushell" = "0.117.0"
"aqua:PowerShell/PowerShell" = "7.7.0"

[env]
# Environment variables to set
MISE_EXPERIMENTAL = "1"
# Authentication is deliberately task-scoped. Do not export a GitHub token
# from this global workstation config: every process launched under mise would
# inherit it, including untrusted build and test commands. GitHub-aware tools
# should invoke `gh` directly so its credential helper retains ownership of
# the token and only supplies it to the requested operation. mise itself gets
# its token the same way, through `github.credential_command` in [settings].
# Build caches live below a per-user XDG root. Environment values are ordered:
# later entries safely reference DOT_BUILD_ROOT through mise's template context.
DOT_BUILD_ROOT = "{{ xdg_cache_home }}/dot/builds"
GOCACHE = "{{ env.DOT_BUILD_ROOT }}/go-cache"
# Go uses the system temporary directory; custom GOTMPDIR must already exist.
PIP_CACHE_DIR = "{{ env.DOT_BUILD_ROOT }}/pip-cache"
UV_CACHE_DIR = "{{ env.DOT_BUILD_ROOT }}/uv-cache"
ZIG_LOCAL_CACHE_DIR = "{{ env.DOT_BUILD_ROOT }}/zig-cache"
ZIG_GLOBAL_CACHE_DIR = "{{ env.DOT_BUILD_ROOT }}/zig-global-cache"
