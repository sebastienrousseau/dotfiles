        linters: [funlen, gocognit, gocyclo]
      - path: ^transaction/abandoned_test\.go$
        source: '^func TestDiscardAbandonedPreservesRecoveryAndUnknownEvidence\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^transaction/abandoned_test\.go$
