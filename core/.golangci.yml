# golangci-lint configuration for core.
#
# Same linter set as the dot-* modules under defaults/dot_local/share.
# `standard` is errcheck + govet + ineffassign + staticcheck + unused.
# CI enforces only the complexity linters here, through
# tools/ci/complexity_polyglot.py; no job runs the full set on this
# module yet.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - funlen
    - gocognit
    - gocyclo
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    # Complexity limits, the same in every Go module and enforced (with a
    # baseline that only shrinks) by tools/ci/complexity_polyglot.py.
    funlen:
      lines: 60
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 10
    revive:
      rules:
        - name: exported # every exported identifier needs a doc comment
        - name: package-comments
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers close pipes and sockets on cleanup paths where a
      # failure cannot affect the assertion under test.
      - path: _test\.go
        linters:
          - errcheck
      # BEGIN complexity baseline: generated from tools/ci/complexity-baseline-go.txt
      # by tools/ci/complexity_polyglot.py --write-baseline; do not edit.
      - path: ^cmd/dot-core/main\.go$
        source: '^func run\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^cmd/dot-hello/main\.go$
        source: '^func run\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^cmd/dot-hello/main_test\.go$
        source: '^func TestNegotiation\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^host/host\.go$
        source: '^func RegisterWithAssurance\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^host/host\.go$
        source: '^func apply\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^host/host\.go$
        source: '^func openBinary\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^host/host_test\.go$
        source: '^func TestChildGroupCleanup\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^host/host_test\.go$
        source: '^func TestIdentityNegotiation\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^host/host_test\.go$
        source: '^func TestLifecycle\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^host/process_darwin_test\.go$
        source: '^func TestGroupExitTransition\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^protocol/protocol\.go$
        source: '^func Read\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^protocol/protocol\.go$
        source: '^func Strict\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^sandbox/run_linux\.go$
        source: '^func restrictSyscalls\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^sandbox/run_linux\.go$
        source: '^func validate\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^sandbox/run_linux_test\.go$
        source: '^func TestLinuxContainment\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^sandbox/run_linux_test\.go$
