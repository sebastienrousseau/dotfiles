        linters: [funlen, gocognit, gocyclo]
      - path: ^transaction/lifecycle\.go$
        source: '^func \((\w+ )?\*Engine(\[[^\]]*\])?\) DiscardAbandoned\b'
        linters: [funlen, gocognit, gocyclo]
      - path: ^transaction/lifecycle\.go$
