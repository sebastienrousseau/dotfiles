# ai-policy-pack: regulated — for controlled environments: agents read and
# write only inside the project, run an allow-listed set of build and test
# commands, reach no network, use no MCP tools, and default to audit mode,
# which only reads. To use it:
#   cp ~/.config/dotfiles/ai-policy.d/regulated.toml ~/.config/dotfiles/ai-policy.toml
# then dot ai policy check. Reference: docs/AI.md, "Enforced policy".
# Every mode also denies the credentials dot manages (the chezmoi age
# identity, chezmoi.toml, ~/.netrc, ~/.npmrc, gh's hosts.yml, dot's secrets
# store, the AI gateway token, the macOS keychains); apply mode denies shell
# commands that name or dump them.
schema = "ai-policy.v1"
default_mode = "audit"

[mode.audit]
tools = ["read", "search"]
paths_allow = ["{cwd}/**"]
paths_deny = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]

[mode.ask]
tools = ["read", "search"]
paths_allow = ["{cwd}/**"]
paths_deny = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]

[mode.plan]
tools = ["read", "search"]
paths_allow = ["{cwd}/**"]
paths_deny = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]

[mode.apply]
tools = ["read", "search", "write", "shell"]
tools_deny = ["mcp__*", "WebFetch", "WebSearch"]
paths_allow = ["{cwd}/**"]
paths_deny = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "{cwd}/.git/**",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]
hosts_deny = ["*"]
commands_allow = ["git status*", "git diff*", "git log*", "make *", "make", "npm test*", "go test *", "cargo test*", "pytest*"]
commands_deny = [
  "sudo *", "rm -rf *", "git push*", "curl *", "wget *", "ssh *",
  "*chezmoi/key.txt*",
  "*chezmoi/chezmoi.*",
  "*.netrc*",
  "*.npmrc*",
  "*gh/hosts.yml*",
  "*dotfiles/secrets/*",
  "*gateway.token*",
  "*Library/Keychains*",
  "security find-generic-password*",
  "security find-internet-password*",
  "security dump-keychain*",
  "security export*",
  "gh auth token*",
  "chezmoi decrypt*",
  "age -d*",
  "age --decrypt*",
]

[budget]
daily_usd = 10
session_usd = 2
