# ai-policy-pack: standard — agents work freely inside the project, ask
# mode is read-only, and secrets, force pushes and piped installers are off
# limits in every mode. To use it:
#   cp ~/.config/dotfiles/ai-policy.d/standard.toml ~/.config/dotfiles/ai-policy.toml
# then dot ai policy check. Reference: docs/AI.md, "Enforced policy".
# Every mode also denies the credentials dot manages (the chezmoi age
# identity, chezmoi.toml, ~/.netrc, ~/.npmrc, gh's hosts.yml, dot's secrets
# store, the AI gateway token, the macOS keychains); apply mode denies shell
# commands that name or dump them.
schema = "ai-policy.v1"
default_mode = "ask"

[mode.ask]
tools = ["read", "search"]
paths_deny = [
  "~/.ssh/**", "~/.aws/**", "~/.gnupg/**", "**/.env", "**/.env.*",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]

[mode.plan]
tools = ["read", "search", "fetch"]
paths_deny = [
  "~/.ssh/**", "~/.aws/**", "~/.gnupg/**", "**/.env", "**/.env.*",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]

[mode.apply]
tools = ["*"]
paths_allow = ["{cwd}/**", "/tmp/**"]
paths_deny = [
  "~/.ssh/**", "~/.aws/**", "~/.gnupg/**", "**/.env", "**/.env.*",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]
commands_deny = [
  "sudo *", "rm -rf /*", "rm -rf ~*", "git push --force*", "git push -f*", "curl * | sh", "curl * | bash", "wget * | sh",
  "*chezmoi/key.txt*",
  "*chezmoi/chezmoi.*",
  "*.netrc*",
  "*.npmrc*",
  "*gh/hosts.yml*",
  "*dotfiles/secrets/*",
  "*gateway.token*",
  "*Library/Keychains*",
  "security find-generic-password*",
  "security find-internet-password*",
  "security dump-keychain*",
  "security export*",
  "gh auth token*",
  "chezmoi decrypt*",
  "age -d*",
  "age --decrypt*",
]

[mode.audit]
tools = ["read", "search"]
paths_deny = [
  "~/.ssh/**", "~/.aws/**", "~/.gnupg/**", "**/.env", "**/.env.*",
  "~/.config/chezmoi/key.txt",
  "~/.config/chezmoi/chezmoi.*",
  "~/.netrc",
  "~/.npmrc",
  "~/.config/gh/hosts.yml",
  "~/.config/dotfiles/secrets/**",
  "~/.local/state/dot/ai/serve/gateway.token",
  "~/Library/Keychains/**",
]

[budget]
daily_usd = 20
session_usd = 5
